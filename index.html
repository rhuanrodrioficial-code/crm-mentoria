<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Viver de Shopee — CRM de Vendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" integrity="sha384-D/t0ZMqQW31H3az8ktEiNb39wyKnS82iFY52QPACM+IjKW3jDUhyIgh2PApRqJZs" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<style>

@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap');

.app{
  --font-d:'Plus Jakarta Sans',system-ui,sans-serif;
  --font-b:'Inter',system-ui,sans-serif;
  --font-m:'JetBrains Mono',ui-monospace,monospace;
  font-family:var(--font-b);
  min-height:100vh;color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
.app.light{
  --bg:#F5F6F9; --surface:#FFFFFF; --surface-2:#F0F2F6; --surface-3:#E9ECF2;
  --border:#E6E8EF; --border-2:#D7DBE4;
  --text:#151A23; --text-2:#586074; --text-3:#8A93A6;
  --brand:#EE4D2D; --brand-2:#D63E1F; --brand-weak:rgba(238,77,45,.10);
  --ok:#12A971; --ok-weak:rgba(18,169,113,.12);
  --warn:#E08A00; --warn-weak:rgba(224,138,0,.13);
  --bad:#E5484D; --bad-weak:rgba(229,72,77,.12);
  --wa:#1FAD55; --wa-weak:rgba(31,173,85,.12);
  --violet:#8B5CF6; --sky:#0EA5E9;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.06);
  --shadow-lg:0 18px 46px -14px rgba(16,24,40,.24);
  --chat:#EDEFF4;
}
.app.dark{
  --bg:#0B0E14; --surface:#141922; --surface-2:#1A2029; --surface-3:#222A35;
  --border:#232B37; --border-2:#2E3745;
  --text:#E9EDF4; --text-2:#98A2B4; --text-3:#6A7488;
  --brand:#FF6740; --brand-2:#FF8163; --brand-weak:rgba(255,103,64,.16);
  --ok:#2ED48D; --ok-weak:rgba(46,212,141,.14);
  --warn:#F4A93A; --warn-weak:rgba(244,169,58,.15);
  --bad:#FF6169; --bad-weak:rgba(255,97,105,.15);
  --wa:#2ED48D; --wa-weak:rgba(46,212,141,.14);
  --violet:#A78BFA; --sky:#38BDF8;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.35);
  --shadow-lg:0 20px 50px -12px rgba(0,0,0,.6);
  --chat:#0E141C;
}
*{box-sizing:border-box}
.app button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.app input,.app textarea,.app select{font-family:inherit;color:inherit}
.app ::-webkit-scrollbar{width:9px;height:9px}
.app ::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:9px}
.app ::-webkit-scrollbar-track{background:transparent}
.mono{font-family:var(--font-m);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.display{font-family:var(--font-d)}

/* layout */
.shell{display:flex;min-height:100vh}
.side{width:246px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:width .22s cubic-bezier(.4,0,.2,1)}
.side.col{width:74px}
.brand{display:flex;align-items:center;gap:11px;padding:19px 20px 16px;min-height:64px}
.logo{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;overflow:hidden;
  background:#000;box-shadow:0 4px 12px -2px rgba(0,0,0,.35)}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.brand-t{font-family:var(--font-d);font-weight:800;font-size:16px;letter-spacing:-.02em;white-space:nowrap}
.brand-s{font-size:11px;color:var(--text-3);white-space:nowrap;margin-top:-2px}
.nav{padding:6px 12px;overflow-y:auto;flex:1}
.nav-lbl{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);padding:14px 10px 6px}
.side.col .nav-lbl,.side.col .brand-txt{display:none}
.nav-i{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--text-2);
  font-size:13.5px;font-weight:500;width:100%;text-align:left;margin:1px 0;position:relative;transition:.14s}
.nav-i:hover{background:var(--surface-2);color:var(--text)}
.nav-i.on{background:var(--brand-weak);color:var(--brand);font-weight:600}
.nav-i.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--brand)}
.nav-i svg{flex-shrink:0}
.side.col .nav-i span{display:none}
.side.col .nav-i{justify-content:center;padding:10px}
.nav-badge{margin-left:auto;font-size:10.5px;font-weight:700;background:var(--brand);color:#fff;
  padding:1px 7px;border-radius:20px;min-width:20px;text-align:center}
.side.col .nav-badge{display:none}
.side-foot{padding:12px;border-top:1px solid var(--border)}
.userchip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;width:100%}
.userchip:hover{background:var(--surface-2)}
.ava{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  font-size:12px;font-weight:700;color:#fff;font-family:var(--font-d)}
.side.col .userchip .u-txt{display:none}
.u-txt{text-align:left;min-width:0}
.u-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-role{font-size:11px;color:var(--text-3)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:64px;flex-shrink:0;border-bottom:1px solid var(--border);background:var(--surface);
  display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:20;backdrop-filter:blur(8px)}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--text-2);transition:.14s;flex-shrink:0}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.gsearch{flex:1;max-width:440px;display:flex;align-items:center;gap:9px;background:var(--surface-2);
  border:1px solid transparent;border-radius:11px;padding:9px 13px;transition:.15s}
.gsearch:focus-within{border-color:var(--brand);background:var(--surface)}
.gsearch input{border:none;background:none;outline:none;width:100%;font-size:13.5px}
.gsearch input::placeholder{color:var(--text-3)}
.kbd{font-size:11px;font-family:var(--font-m);color:var(--text-3);background:var(--surface);border:1px solid var(--border);
  border-radius:5px;padding:1px 6px}
.top-r{margin-left:auto;display:flex;align-items:center;gap:4px}
.dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}

.page{padding:26px 28px;flex:1;overflow-x:hidden;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-title{font-family:var(--font-d);font-weight:800;font-size:24px;letter-spacing:-.03em}
.page-sub{font-size:13.5px;color:var(--text-2);margin-top:3px}
.head-actions{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:9px 15px;
  border-radius:10px;transition:.14s;white-space:nowrap}
.btn-p{background:var(--brand);color:#fff;box-shadow:0 4px 12px -3px var(--brand-weak)}
.btn-p:hover{background:var(--brand-2)}
.btn-g{background:var(--surface);border:1px solid var(--border);color:var(--text-2)}
.btn-g:hover{border-color:var(--border-2);color:var(--text);background:var(--surface-2)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:7px;color:var(--text-2)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:15px}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 18px 0}
.card-t{font-family:var(--font-d);font-weight:700;font-size:14.5px;letter-spacing:-.01em}

/* KPI */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:16px 17px;
  transition:.16s;position:relative;overflow:hidden}
.kpi:hover{border-color:var(--border-2);box-shadow:var(--shadow);transform:translateY(-2px)}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.kpi-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
.kpi-lbl{font-size:12px;color:var(--text-2);font-weight:500;margin-bottom:4px}
.kpi-val{font-family:var(--font-m);font-weight:700;font-size:24px;letter-spacing:-.03em;line-height:1}
.kpi-delta{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;margin-top:9px;
  padding:2px 7px;border-radius:20px}
.up{color:var(--ok);background:var(--ok-weak)}
.down{color:var(--bad);background:var(--bad-weak)}
.flat{color:var(--text-2);background:var(--surface-2)}

.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
@media(max-width:1080px){.grid2,.grid3{grid-template-columns:1fr}}

.rank-row{display:flex;align-items:center;gap:12px;padding:10px 18px;transition:.12s}
.rank-row:hover{background:var(--surface-2)}
.rank-n{width:22px;height:22px;border-radius:7px;font-size:12px;font-weight:700;display:grid;place-items:center;
  font-family:var(--font-m);flex-shrink:0}
.bar-track{height:6px;background:var(--surface-2);border-radius:6px;overflow:hidden;margin-top:6px}
.bar-fill{height:100%;border-radius:6px}

.ring-wrap{position:relative;width:150px;height:150px;margin:6px auto}
.ring-center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}

.act-row{display:flex;gap:12px;padding:11px 18px;border-top:1px solid var(--border)}
.act-time{font-family:var(--font-m);font-size:11.5px;color:var(--text-3);width:44px;flex-shrink:0;padding-top:1px}
.act-dot{width:9px;height:9px;border-radius:50%;margin-top:4px;flex-shrink:0}

/* funil */
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;min-height:60vh}
.col{width:274px;flex-shrink:0;display:flex;flex-direction:column;background:var(--surface-2);
  border-radius:14px;border:1px solid var(--border);transition:.14s}
.col.drag{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-weak)}
.col-h{display:flex;align-items:center;gap:8px;padding:13px 14px 10px}
.col-tag{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.col-t{font-size:13px;font-weight:700;font-family:var(--font-d)}
.col-c{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--text-3);background:var(--surface);
  padding:1px 8px;border-radius:20px;font-family:var(--font-m)}
.col-body{padding:4px 10px 12px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:9px;min-height:60px}
.lcard{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px;cursor:grab;
  transition:.14s;border-left:3px solid transparent}
.lcard:hover{box-shadow:var(--shadow);border-color:var(--border-2)}
.lcard:active{cursor:grabbing}
.lcard.ghost{opacity:.4}
.lcard-t{font-size:13px;font-weight:600;line-height:1.3;margin-bottom:3px}
.lcard-s{font-size:11.5px;color:var(--text-3);display:flex;align-items:center;gap:5px;margin-bottom:9px}
.lcard-f{display:flex;align-items:center;justify-content:space-between;margin-top:9px}
.lcard-v{font-family:var(--font-m);font-size:12.5px;font-weight:700;color:var(--ok)}
.chip{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:6px;display:inline-flex;align-items:center;gap:4px}
.mini-ava{width:22px;height:22px;border-radius:50%;font-size:9.5px;font-weight:700;color:#fff;display:grid;place-items:center;font-family:var(--font-d)}

/* table */
.tbl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:15px;overflow:hidden}
.tbl-tools{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tbl-scroll{overflow-x:auto}
table.crm{width:100%;border-collapse:collapse;font-size:13px;min-width:840px}
.crm th{text-align:left;padding:11px 16px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--text-3);border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2)}
.crm th.sortable{cursor:pointer;user-select:none}
.crm td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
.crm tr:last-child td{border-bottom:none}
.crm tbody tr{transition:.1s}
.crm tbody tr:hover{background:var(--surface-2);cursor:pointer}
.cell-co{display:flex;align-items:center;gap:10px}
.badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:7px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.cbox{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--border-2);display:grid;place-items:center;flex-shrink:0;transition:.12s}
.cbox.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* chat */
.chat-wrap{display:grid;grid-template-columns:314px 1fr 300px;height:calc(100vh - 64px);overflow:hidden}
.conv-list{border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
.conv-search{padding:12px 14px;border-bottom:1px solid var(--border)}
.conv-scroll{overflow-y:auto;flex:1}
.conv{display:flex;gap:11px;padding:12px 14px;border-bottom:1px solid var(--border);transition:.12s;position:relative}
.conv:hover{background:var(--surface-2)}
.conv.on{background:var(--brand-weak)}
.conv.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
.conv-mid{flex:1;min-width:0}
.conv-top{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.conv-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.conv-time{font-size:11px;color:var(--text-3);font-family:var(--font-m);flex-shrink:0}
.conv-msg{font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-unread{background:var(--wa);color:#fff;font-size:10.5px;font-weight:700;border-radius:20px;min-width:19px;height:19px;
  display:grid;place-items:center;padding:0 5px;font-family:var(--font-m);flex-shrink:0}

.thread{display:flex;flex-direction:column;background:var(--chat);overflow:hidden}
.thread-h{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.msgs{flex:1;overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:8px}
.day-sep{align-self:center;font-size:11px;color:var(--text-3);background:var(--surface);border:1px solid var(--border);
  padding:3px 12px;border-radius:20px;margin:6px 0}
.bub{max-width:66%;padding:8px 12px;border-radius:13px;font-size:13.5px;line-height:1.42;position:relative;box-shadow:var(--shadow)}
.bub.in{align-self:flex-start;background:var(--surface);border-top-left-radius:4px}
.bub.out{align-self:flex-end;background:var(--wa-weak);border-top-right-radius:4px}
.bub-meta{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:10.5px;color:var(--text-3);margin-top:3px;font-family:var(--font-m)}
.composer{display:flex;align-items:center;gap:9px;padding:12px 16px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
.composer input{flex:1;border:1px solid var(--border);background:var(--surface-2);border-radius:22px;padding:11px 16px;font-size:13.5px;outline:none}
.composer input:focus{border-color:var(--brand)}
.qr-bar{display:flex;gap:7px;padding:9px 16px 0;flex-wrap:wrap}
.qr{font-size:11.5px;font-weight:500;padding:5px 11px;border-radius:18px;background:var(--surface);border:1px solid var(--border);color:var(--text-2);transition:.12s}
.qr:hover{border-color:var(--brand);color:var(--brand)}

.info-panel{border-left:1px solid var(--border);background:var(--surface);overflow-y:auto}
.info-hero{padding:22px 18px;text-align:center;border-bottom:1px solid var(--border)}
.info-sec{padding:15px 18px;border-bottom:1px solid var(--border)}
.info-sec-t{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:11px}
.info-row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:5px 0}
.info-row .k{color:var(--text-3)}
.info-row .v{font-weight:600;text-align:right}

/* drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(8,11,17,.5);backdrop-filter:blur(2px);z-index:60;animation:fade .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,94vw);background:var(--surface);z-index:70;
  box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:slidein .28s cubic-bezier(.4,0,.2,1)}
@keyframes slidein{from{transform:translateX(30px);opacity:.5}to{transform:none;opacity:1}}
.drawer-h{padding:20px 22px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:14px}
.drawer-body{overflow-y:auto;flex:1}

.modal-bg{position:fixed;inset:0;background:rgba(8,11,17,.5);backdrop-filter:blur(2px);z-index:85;
  display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s}
.modal{width:min(520px,100%);max-height:88vh;display:flex;flex-direction:column;background:var(--surface);
  border-radius:16px;box-shadow:var(--shadow-lg);animation:modalin .22s cubic-bezier(.4,0,.2,1)}
@keyframes modalin{from{transform:scale(.96) translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal-h{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.modal-t{font-family:var(--font-d);font-weight:800;font-size:16px;letter-spacing:-.01em}
.modal-body{padding:20px;overflow-y:auto;display:grid;gap:14px}
.modal-f{display:grid;gap:14px 16px}
.modal-f.two{grid-template-columns:1fr 1fr}
.field-l label{font-size:11.5px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.03em;display:block;margin-bottom:6px}
.field-l input,.field-l select,.field-l textarea{width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--border);
  background:var(--surface-2);font-size:13.5px;outline:none;font-family:inherit;color:inherit}
.field-l input:focus,.field-l select:focus,.field-l textarea:focus{border-color:var(--brand);background:var(--surface)}
.field-l .row{display:flex;gap:8px}
.modal-foot{padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:9px}
.inline-msg{font-size:12px;padding:9px 12px;border-radius:9px;display:flex;align-items:center;gap:8px}
.quick-link{display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:11px;border:1px solid var(--border);
  font-size:13px;font-weight:600;transition:.14s}
.quick-link:hover{border-color:var(--border-2);background:var(--surface-2)}
.tabs{display:flex;gap:2px;padding:0 22px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:2}
.tab{font-size:13px;font-weight:600;color:var(--text-2);padding:13px 4px;margin-right:18px;position:relative}
.tab.on{color:var(--brand)}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--brand);border-radius:2px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px 20px;padding:22px}
.field label{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:5px}
.field .fv{font-size:13.5px;font-weight:500}
.field.full{grid-column:1/-1}
.timeline{padding:8px 22px 22px}
.tl-item{display:flex;gap:13px;padding:12px 0;position:relative}
.tl-item:not(:last-child)::before{content:"";position:absolute;left:15px;top:34px;bottom:-12px;width:2px;background:var(--border)}
.tl-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}

.hidden-m{display:block}
.only-m{display:none}
.menu-btn{display:none}

/* ============================================================
   RESPONSIVO — de celulares pequenos e antigos até phablets, tablet,
   notebook/desktop (padrão do restante do CSS acima), monitor grande
   e TV/4K. Usa clamp() pra escalar suavemente dentro da faixa de
   celulares, em vez de só pular entre tamanhos fixos.
   ============================================================ */

/* Respeita o entalhe/câmera de celulares com tela borda-a-borda
   (iPhone com notch/Dynamic Island, Android com "furo"). */
.top{padding-left:max(22px, env(safe-area-inset-left)); padding-right:max(22px, env(safe-area-inset-right))}
.side{padding-left:env(safe-area-inset-left)}

/* Celular (até 640px): sidebar em cima do conteúdo (overlay), tudo em
   coluna única. Paddings e fontes com clamp() pra acompanhar o tamanho
   real do aparelho em vez de só "ligar/desligar" num ponto de corte. */
@media(max-width:640px){
  .side{position:fixed;z-index:80;top:0;bottom:0;transform:translateX(-100%);box-shadow:var(--shadow-lg);width:84vw;max-width:290px;
    padding-bottom:env(safe-area-inset-bottom)}
  .side.open{transform:none}
  .menu-btn{display:grid}
  .chat-wrap{grid-template-columns:1fr}
  .info-panel{display:none}
  .conv-list.hide-m{display:none}
  .thread.hide-m{display:none}
  .kgrid{grid-template-columns:repeat(auto-fill,minmax(clamp(120px,38vw,160px),1fr));gap:clamp(8px,2.2vw,10px)}
  .gsearch .kbd{display:none}
  .hidden-m{display:none}
  .only-m{display:block}
  .page{padding:clamp(12px,4vw,18px) clamp(10px,3.5vw,15px)}
  .page-title{font-size:clamp(18px,5.6vw,21px)}
  .page-sub{font-size:clamp(12px,3.2vw,13.5px)}
  .drawer{width:100%}
  .drawer-body,.drawer-h{padding-bottom:env(safe-area-inset-bottom)}
  .modal{max-height:92vh;margin-bottom:env(safe-area-inset-bottom)}
  .modal-bg{padding:clamp(8px,3vw,20px)}
  .icon-btn{width:clamp(38px,10vw,41px);height:clamp(38px,10vw,41px)}
  table.crm{min-width:640px}
  .fgrid{grid-template-columns:1fr}
  .modal-f.two{grid-template-columns:1fr}
  .top{gap:clamp(8px,3vw,14px);height:60px}
  .gsearch{padding:clamp(7px,2vw,9px) clamp(10px,3vw,13px)}
  .gsearch input{font-size:clamp(12.5px,3.4vw,13.5px)}
  .btn{padding:clamp(8px,2.4vw,9px) clamp(11px,3.4vw,15px);font-size:clamp(12px,3.2vw,13px)}
  .lcard{padding:clamp(9px,3vw,12px)}
  .col{width:clamp(230px,72vw,274px)}
  .composer input{padding:clamp(9px,2.6vw,11px) clamp(12px,3.6vw,16px)}
  .conv{padding:clamp(9px,2.8vw,12px) clamp(10px,3vw,14px)}
  .kpi{padding:clamp(12px,3.6vw,16px) clamp(13px,3.8vw,17px)}
  .kpi-val{font-size:clamp(18px,5.4vw,22px)}
  .modal-h,.drawer-h{padding:clamp(14px,4vw,20px)}
  .modal-body{padding:clamp(14px,4vw,20px)}
}

/* Celular padrão (até 430px — cobre a maioria dos iPhones/Android atuais) */
@media(max-width:430px){
  .kgrid{grid-template-columns:1fr 1fr}
  .head-actions{gap:7px}
  .seg button{padding:5px 9px;font-size:12px}
  .tabs{padding:0 16px}
  .tab{margin-right:14px;font-size:12.5px}
}

/* Celular compacto (até 375px — iPhone SE/mini, Android compactos) */
@media(max-width:375px){
  .top{gap:8px;padding-left:max(12px, env(safe-area-inset-left));padding-right:max(12px, env(safe-area-inset-right))}
  .kbd{display:none}
  .brand{padding:16px 14px 12px}
  .kpi-lbl{font-size:11px}
  .card-t{font-size:13.5px}
  .btn{gap:5px}
}

/* Celular pequeno/antigo (até 340px — ex.: iPhone 5/SE 1ª geração) */
@media(max-width:340px){
  .kgrid{grid-template-columns:1fr}
  .page{padding:10px 8px}
  .head-actions{gap:6px}
  .head-actions .btn{padding:8px 10px;font-size:11.5px}
  .thread-h{padding:10px 12px;gap:8px}
}

/* Celular deitado (landscape) — largura pode ser grande mas a altura é
   curta; prioriza aproveitar a altura em vez da largura. */
@media(max-width:900px) and (orientation:landscape) and (max-height:520px){
  .top{height:52px}
  .brand{padding:12px 16px 10px;min-height:48px}
  .page{padding:12px 16px}
  .modal{max-height:94vh}
  .modal-body{max-height:60vh}
  .kanban{min-height:40vh}
  .loading-screen{height:100vh;gap:8px}
  .drawer-h{padding:12px 18px}
  .msgs{padding:12px 16px}
  .composer{padding:8px 14px}
}

/* Tablet (641–1024px): sidebar fica como trilho fino de ícones sempre visível;
   toca no menu pra expandir por cima temporariamente. */
@media(min-width:641px) and (max-width:1024px){
  .side{width:74px}
  .side .nav-lbl,.side .brand-txt,.side .nav-i span,.side .nav-badge,.side .userchip .u-txt{display:none}
  .side .nav-i{justify-content:center;padding:10px}
  .side.open{width:246px;position:fixed;z-index:80;top:0;bottom:0;box-shadow:var(--shadow-lg)}
  .side.open .nav-lbl,.side.open .brand-txt,.side.open .nav-i span,.side.open .userchip .u-txt{display:block}
  .side.open .nav-i{justify-content:flex-start;padding:9px 10px}
  .side.open .nav-badge{display:inline-block}
  .menu-btn{display:grid}
  .hidden-m{display:none}
  .chat-wrap{grid-template-columns:270px 1fr}
  .info-panel{display:none}
  .kgrid{grid-template-columns:repeat(auto-fill,minmax(175px,1fr))}
  .page{padding:22px 24px}
}

/* Telas grandes (monitores largos, 1600px+): conteúdo ganha um teto de largura
   pra não esticar de ponta a ponta, e mais respiro nas laterais. */
@media(min-width:1600px){
  .page{max-width:1760px;margin:0 auto;padding-left:40px;padding-right:40px}
  .kgrid{grid-template-columns:repeat(auto-fill,minmax(235px,1fr))}
  .chat-wrap{max-width:1760px;margin:0 auto}
}

/* TVs e monitores 4K (2200px+): tudo um pouco maior, pensado pra ser visto
   de mais longe ("interface de 10 pés") — textos, ícones e áreas de toque
   maiores, mais espaçamento. */
@media(min-width:2200px){
  .page{max-width:1980px;padding-left:56px;padding-right:56px}
  .side{width:290px}
  .brand-t{font-size:18px}
  .nav-i{font-size:15.5px;padding:12px 13px;gap:13px}
  .nav-i svg,.nav-i img{width:21px;height:21px}
  .top{height:76px;padding:0 32px}
  .icon-btn{width:44px;height:44px}
  .gsearch{padding:12px 16px}
  .gsearch input{font-size:15px}
  .page-title{font-size:30px}
  .page-sub{font-size:15px}
  .btn{font-size:14.5px;padding:11px 18px}
  .card-t{font-size:16px}
  .kpi-val{font-size:29px}
  .kpi-lbl{font-size:13.5px}
  .kpi{padding:20px 21px}
  .chat-wrap{max-width:1980px}
}

/* Dispositivos por toque (tablets, celulares, TVs com controle): garante
   áreas de toque confortáveis mesmo quando o mouse não é a entrada principal. */
@media(hover:none) and (pointer:coarse){
  .icon-btn{width:42px;height:42px}
  .nav-i{padding:11px 10px}
  .btn{padding:10px 16px}
  .cbox{width:20px;height:20px}
}

.reveal{animation:fade .35s ease}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.spinner{animation:spin 1s linear infinite}
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:70vh;gap:14px;color:var(--text-3)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

async function tryLookupCnpjDireto(cnpj) {
  const numero = onlyDigits(cnpj);
  if (numero.length !== 14) return { ok: false, error: "CNPJ deve ter 14 dígitos." };
  try {
    const res = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${numero}`);
    if (!res.ok) return { ok: false, error: res.status === 404 ? "CNPJ não encontrado." : "Consulta falhou (HTTP " + res.status + ")." };
    const d = await res.json();
    return { ok: true, data: { razao: d.razao_social, fantasia: d.nome_fantasia || d.razao_social, situacao: d.descricao_situacao_cadastral, abertura: d.data_inicio_atividade, seg: d.cnae_fiscal_descricao, email: d.email || "", tel: d.ddd_telefone_1 || "" } };
  } catch {
    return { ok: false, error: "Não foi possível consultar automaticamente. Preencha manualmente." };
  }
}

let tokens = { access: null, refresh: null };
function loadTokens() {
  try { const raw = store.get("vds_tokens"); if (raw) tokens = JSON.parse(raw); } catch (e) {}
}
function saveTokensLocal(t) { tokens = t; try { store.set("vds_tokens", JSON.stringify(t)); } catch (e) {} }
function clearTokensLocal() { tokens = { access: null, refresh: null }; store.remove("vds_tokens"); }

async function apiFetch(path, options = {}, retry = true) {
  const headers = Object.assign({ "Content-Type": "application/json" }, options.headers || {});
  if (tokens.access) headers["Authorization"] = "Bearer " + tokens.access;
  let res;
  try {
    res = await fetch(API_BASE + path, { ...options, headers });
  } catch (e) {
    throw new Error("Não foi possível falar com o servidor. Verifique sua internet ou tente novamente.");
  }
  if (res.status === 401 && retry && tokens.refresh && path !== "/auth/refresh") {
    const refreshed = await tryRefreshToken();
    if (refreshed) return apiFetch(path, options, false);
  }
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    if (res.status === 401) { clearTokensLocal(); ui.view = "login"; render(); }
    throw new Error(data?.error?.message || `Erro ${res.status} ao falar com o servidor.`);
  }
  return data;
}
async function tryRefreshToken() {
  try {
    const res = await fetch(API_BASE + "/auth/refresh", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ refreshToken: tokens.refresh }),
    });
    if (!res.ok) throw new Error();
    const data = await res.json();
    saveTokensLocal({ access: data.data.accessToken, refresh: data.data.refreshToken });
    return true;
  } catch (e) { clearTokensLocal(); return false; }
}
function qs(params) {
  const clean = Object.fromEntries(Object.entries(params || {}).filter(([, v]) => v !== undefined && v !== null && v !== ""));
  const s = new URLSearchParams(clean).toString();
  return s ? `?${s}` : "";
}

/* Downloads autenticados (CSV/Excel/PDF) — não dá pra usar um <a href> comum
   porque o download precisa do header Authorization; então buscamos como
   blob via fetch e disparamos o download manualmente. */
async function downloadWithAuth(path, filename) {
  try {
    const headers = {};
    if (tokens.access) headers["Authorization"] = "Bearer " + tokens.access;
    const res = await fetch(API_BASE + path, { headers });
    if (!res.ok) throw new Error("Não foi possível gerar o arquivo (HTTP " + res.status + ").");
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
  } catch (e) {
    toast(e.message || "Não foi possível baixar o arquivo.");
  }
}

   religados à API — Tarefas, Agenda, Clientes, Equipe, Automação) ----------
   Leads, Conversas e o Funil já vêm do backend real (ver api.* acima); só o
   que ainda não foi religado usa este cache local simples, sem tempo real
   entre aparelhos. Ver README do backend para o padrão de como religar. */
let syncState = "off"; // 'off' | 'connecting' | 'on' | 'error' — agora reflete a conexão com a API, não mais o Firebase
const SYNC_KEYS = ["tasks", "eventos", "equipe", "meta", "log", "demoMode", "integr", "automacao", "automacaoAtiva"];

const SB_KV_KEYS = ["tasks", "eventos", "equipe", "meta", "log", "demoMode", "stages", "automacao", "automacaoAtiva", "gcal"];

function cacheLocally() { try { store.set("crm_vivershopee_v1", JSON.stringify(sb ? { integr: state.integr } : state)); } catch (e) {} }
function tryParse(v, fallback) { try { return JSON.parse(v); } catch { return fallback; } }
function loadFromCacheOnly() {
  try {
    const raw = store.get("crm_vivershopee_v1");
    if (raw) {
      const cached = tryParse(raw, null);

/* Salva uma fatia do estado localmente. Usado só pelos módulos ainda não
   religados à API (ver comentário acima) — "leads" e "convs" não passam
   mais por aqui, eles são persistidos direto no backend pelas próprias
   funções de ação (moveStage, sendChatMessage, etc.), que já falam com a API. */
function saveSlice(key) {
  cacheLocally();
  if (!sb || !sbSession) return;
  if (key === "leads") sbSyncLeads();
  else if (SB_KV_KEYS.includes(key)) sbQueueKv(key);
}

/* ---------- Supabase: leitura, gravação e tempo real ---------- */
const sbLeadSnap = new Map(); // id -> JSON da última versão conhecida no banco
let sbLeadChain = Promise.resolve();
const sbKvTimers = {};
let sbLastLocalWrite = 0;

const NOTA_TIPOS = [["Chamada de vídeo", "video"], ["Ligação", "phone"], ["WhatsApp", "message-circle"], ["Reunião presencial", "users"], ["Como começou", "play"], ["Dúvida / objeção", "help-circle"], ["Observação", "file-text"]];
let notasDisponivel = true; // vira false se a tabela ainda não existe no Supabase
const notaIcon = (tipo) => (NOTA_TIPOS.find(t => t[0] === tipo) || NOTA_TIPOS[6])[1];
function notaToRow(n) {

    data_evento: new Date(n.dataEvento).toISOString(), autor: n.autor || null, editado_por: n.editadoPor || null };

function sbFail(what, error) {
  console.error("[supabase] " + what, error);
  syncState = "error"; render();
  toast("Não foi possível salvar no servidor (" + (error?.message || what) + ").");
}
/* Compara os leads da tela com o último estado conhecido do banco e envia só o que mudou. */
function sbSyncLeads() {
  sbLeadChain = sbLeadChain.then(async () => {
    const rows = state.leads.map(leadToRow);
    const keep = new Set(rows.map(r => r.id));
    const changed = rows.filter(r => sbLeadSnap.get(r.id) !== JSON.stringify(r));
    const removed = [...sbLeadSnap.keys()].filter(id => !keep.has(id));
    if (!changed.length && !removed.length) return;
    sbLastLocalWrite = Date.now();
    // Em lotes: importar milhares de leads de uma vez estoura o tamanho do pedido (e a URL do delete).
    for (let i = 0; i < changed.length; i += 500) {
      const lote = changed.slice(i, i + 500);
      const { error } = await sb.from("leads").upsert(lote);
      if (error) return sbFail("leads.upsert", error);
      lote.forEach(r => sbLeadSnap.set(r.id, JSON.stringify(r)));
    }
    for (let i = 0; i < removed.length; i += 100) {
      const lote = removed.slice(i, i + 100);
      const { error } = await sb.from("leads").delete().in("id", lote);
      if (error) return sbFail("leads.delete", error);
      lote.forEach(id => sbLeadSnap.delete(id));
    }
  }).catch(e => sbFail("leads", e));
  return sbLeadChain;
}
function sbQueueKv(key) {
  clearTimeout(sbKvTimers[key]);
  sbKvTimers[key] = setTimeout(async () => {
    sbLastLocalWrite = Date.now();
    const { error } = await sb.from("kv").upsert({ key, value: state[key] === undefined ? null : state[key] });
    if (error) sbFail("kv." + key, error);
  }, 500);
}
// O Supabase corta cada busca em 1.000 linhas; lê em blocos até acabar (ordem estável por desempate no id).
async function sbPaginar(tabela, ordem, ordem2) {
  const TAM = 1000, todos = [];
  for (let de = 0; ; de += TAM) {
    const { data, error } = await sb.from(tabela).select("*").order(ordem, { ascending: false }).order(ordem2, { ascending: true }).range(de, de + TAM - 1);
    if (error) return { data: null, error };
    todos.push(...data);
    if (data.length < TAM) return { data: todos, error: null };
  }
}
async function sbLoadAll() {
  const [leadsRes, kvRes, notasRes] = await Promise.all([
    sbPaginar("leads", "created_at", "id"),
    sb.from("kv").select("key,value"),
    sbPaginar("lead_notas", "data_evento", "id"),
  ]);
  if (leadsRes.error) throw leadsRes.error;
  if (kvRes.error) throw kvRes.error;
  // Sem a tabela lead_notas o resto do CRM segue funcionando; só as anotações ficam indisponíveis.
  notasDisponivel = !notasRes.error;
  state.notas = notasRes.error ? [] : notasRes.data.map(notaFromRow);
  state.leads = leadsRes.data.map(leadFromRow);
  sbLeadSnap.clear();
  state.leads.forEach(l => { const row = leadToRow(l); sbLeadSnap.set(row.id, JSON.stringify(row)); });
  sbAplicarKv(kvRes.data);
}
function sbAplicarKv(linhas) {
  linhas.forEach(r => { if (SB_KV_KEYS.includes(r.key) && r.value !== null) state[r.key] = r.value; });
  if (!Array.isArray(state.stages) || !state.stages.length) state.stages = DEFAULT_STAGES.map(s => ({ ...s }));
  // Cores entram em atributos style="..." — aceita só hex, descarta o resto.
  state.stages = state.stages.map((s, i) => ({ ...s, cor: /^#[0-9a-fA-F]{3,8}$/.test(s.cor) ? s.cor : AV[i % AV.length] }));
}
let sbReloadTimer = null, sbKvReloadTimer = null;
let sbChannel = null;
async function sbSubscribe() {
  if (sbChannel) return;
  // Entrega o login ao Realtime antes de inscrever: sem ele o canal entra como visitante e o RLS
  // (leitura só para usuário logado) descarta todos os avisos, mesmo com o selo "Sincronizado".
  try { const { data } = await sb.auth.getSession(); if (data && data.session) sb.realtime.setAuth(data.session.access_token); } catch (e) {}
  if (sbChannel) return;
  const onChange = () => {
    if (Date.now() - sbLastLocalWrite < 1500) return; // eco da nossa própria gravação
    clearTimeout(sbReloadTimer);
    sbReloadTimer = setTimeout(() => sbLoadAll().then(render).catch(() => {}), 400);
  };
  // Leads e anotações: aplica só a linha que mudou (recarregar milhares de leads a cada novo cadastro pesa).
  // O eco das nossas gravações some sozinho: a linha recebida é igual à que já temos.
  let sbRenderTimer = null;
  const renderSoon = () => { clearTimeout(sbRenderTimer); sbRenderTimer = setTimeout(render, 150); };
  const onLead = (pl) => {
    try {
      if (pl.eventType === "DELETE") {
        const id = pl.old && pl.old.id; if (!id) return onChange();
        if (!sbLeadSnap.has(id)) return;
        sbLeadSnap.delete(id); state.leads = state.leads.filter(l => l.id !== id); renderSoon(); return;
      }
      const lead = leadFromRow(pl.new), txt = JSON.stringify(leadToRow(lead));
      if (sbLeadSnap.get(lead.id) === txt) return;
      sbLeadSnap.set(lead.id, txt);
      const i = state.leads.findIndex(l => l.id === lead.id);
      if (i >= 0) state.leads[i] = lead; else state.leads.unshift(lead);
      renderSoon();
    } catch (e) { onChange(); }
  };
  const onNota = (pl) => {
    try {
      if (pl.eventType === "DELETE") { const id = pl.old && pl.old.id; if (!id) return onChange(); state.notas = state.notas.filter(n => n.id !== id); renderSoon(); return; }
      const n = notaFromRow(pl.new), i = state.notas.findIndex(x => x.id === n.id);
      if (i >= 0) { if (JSON.stringify(state.notas[i]) === JSON.stringify(n)) return; state.notas[i] = n; } else state.notas.unshift(n);
      renderSoon();
    } catch (e) { onChange(); }
  };
  sbChannel = sb.channel("crm-sync")
    .on("postgres_changes", { event: "*", schema: "public", table: "leads" }, onLead)
    .on("postgres_changes", { event: "*", schema: "public", table: "kv" }, () => {
      if (Date.now() - sbLastLocalWrite < 1500) return;
      clearTimeout(sbKvReloadTimer);
      // só a tabela kv (pequena): o histórico muda a cada ação e não deve recarregar os leads
      sbKvReloadTimer = setTimeout(async () => { const r = await sb.from("kv").select("key,value"); if (!r.error) { sbAplicarKv(r.data); render(); } }, 400);
    })
    .subscribe((status) => { syncState = status === "SUBSCRIBED" ? "on" : status === "CHANNEL_ERROR" ? "error" : "connecting"; render(); });
  // Canal separado: se a tabela de anotações não existir, não derruba a sincronização dos leads.
  if (notasDisponivel) sb.channel("crm-notas").on("postgres_changes", { event: "*", schema: "public", table: "lead_notas" }, onNota).subscribe();
}
function sbUserFromSession(session) {

  const nome = u.user_metadata?.nome || (u.email || "Usuário").split("@")[0].replace(/[._-]+/g, " ").replace(/\b\w/g, c => c.toUpperCase());
  return { id: u.id, nome, email: u.email, role: "admin", roleNome: "Administrador" };
}

/* ---------- Anotações avançadas (histórico detalhado do lead) ---------- */
async function salvarNota(nota, isEdit) {
  const antes = state.notas;
  state.notas = (isEdit ? state.notas.map(n => n.id === nota.id ? nota : n) : [nota, ...state.notas]).sort((a, b) => b.dataEvento - a.dataEvento);
  render();
  if (sb && sbSession) {
    sbLastLocalWrite = Date.now();
    const { error } = await sb.from("lead_notas").upsert(notaToRow(nota));
    if (error) { state.notas = antes; render(); showErrorBanner("Anotação não foi salva: " + (error.message || "") + (error.code ? " [" + error.code + "]" : "")); return sbFail("lead_notas.upsert", error); }
  }
  addLogEntry(`Anotação "${nota.titulo}" (${nota.tipo}) ${isEdit ? "editada" : "registrada"}`, nota.leadId);
  toast(isEdit ? "Anotação atualizada." : "Anotação registrada.");
}
async function excluirNota(id) {
  const nota = state.notas.find(n => n.id === id);
  if (!nota) return;
  const antes = state.notas;
  state.notas = state.notas.filter(n => n.id !== id);
  render();
  if (sb && sbSession) {
    sbLastLocalWrite = Date.now();
    const { error } = await sb.from("lead_notas").delete().eq("id", id);
    if (error) { state.notas = antes; render(); showErrorBanner("Anotação não foi excluída: " + (error.message || "") + (error.code ? " [" + error.code + "]" : "")); return sbFail("lead_notas.delete", error); }
  }
  addLogEntry(`Anotação "${nota.titulo}" excluída`, nota.leadId);
  toast("Anotação excluída.");
}
function exportarNotas(lead) {
  const lista = state.notas.filter(n => n.leadId === lead.id).sort((a, b) => a.dataEvento - b.dataEvento);
  if (!lista.length) { toast("Este lead ainda não tem anotações para exportar."); return; }
  // Prefixa ' em textos que o Excel leria como fórmula (=, +, -, @).
  const seguro = (v) => /^[=+\-@\t\r]/.test(v) ? "'" + v : v;
  const slug = lead.nome.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "lead";
  csvExport(`anotacoes-${slug}.csv`, lista.map(n => ({
    "Lead": seguro(lead.nome), "Data": new Date(n.dataEvento).toLocaleString("pt-BR"), "Tipo": n.tipo,
    "Título": seguro(n.titulo), "Anotação": seguro(n.texto), "Registrado por": seguro(n.autor), "Editado por": seguro(n.editadoPor),
  })));
  toast("Anotações exportadas.");
}
async function moveStage(id, stage) {
  const l = state.leads.find(x => x.id === id);
  if (!l || l.stage === stage) return;

  if (PREVIEW_SEM_LOGIN) {
    state.leads = state.leads.map(x => x.id === id ? { ...x, stage } : x);
    toast(`Lead movido para "${stageOf(stage).nome}" (pré-visualização, não gravado no servidor).`);
    render();
    return;
  }

  // Otimista: move na tela na hora; se o banco recusar, volta pro lugar.
  const before = l.stage;
  state.leads = state.leads.map(x => x.id === id ? { ...x, stage } : x);
  render();
  await sbSyncLeads();
  const saved = sbLeadSnap.get(id);
  if (saved && JSON.parse(saved).stage === stage) toast(`Lead movido para "${stageOf(stage).nome}".`);
  else { state.leads = state.leads.map(x => x.id === id ? { ...x, stage: before } : x); render(); }
}

/* ---------- Etapas do funil (editáveis: criar, renomear, remover, reordenar) ---------- */
function addStage(nome, cor) {
  const id = "et_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  state.stages = [...state.stages, { id, nome, cor: cor || AV[state.stages.length % AV.length] }];
  saveSlice("stages");
  addLogEntry(`Etapa "${nome}" criada no funil`);
  render();
}
function renameStage(id, novoNome, novaCor) {
  state.stages = state.stages.map(s => s.id === id ? { ...s, nome: novoNome, cor: novaCor || s.cor } : s);
  saveSlice("stages");
  render();
}
function removeStage(id) {
  if (state.stages.length <= 1) { toast("Precisa sobrar pelo menos uma etapa."); return; }
  const alvo = state.stages.find(s => s.id === id);
  const afetados = state.leads.filter(l => l.stage === id).length;
  const destino = state.stages.find(s => s.id !== id);
  customConfirm(afetados > 0
    ? `A etapa "${alvo.nome}" tem ${afetados} lead(s). Eles serão movidos para "${destino.nome}". Remover mesmo assim?`
    : `Remover a etapa "${alvo.nome}"?`, true, () => {
    if (afetados > 0) { state.leads = state.leads.map(l => l.stage === id ? { ...l, stage: destino.id } : l); saveSlice("leads"); }
    state.stages = state.stages.filter(s => s.id !== id);
    saveSlice("stages");
    addLogEntry(`Etapa "${alvo.nome}" removida do funil`);
    render();
  });
}
function moveStageOrder(id, dir) {
  const i = state.stages.findIndex(s => s.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= state.stages.length) return;
  const arr = state.stages.slice();
  [arr[i], arr[j]] = [arr[j], arr[i]];
  state.stages = arr;
  saveSlice("stages");
  render();
}

function toggleTask(id) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  state.tasks = state.tasks.map(x => x.id === id ? { ...x, done: !x.done } : x);
  saveSlice("tasks");
  addLogEntry(`Tarefa "${t.t}" marcada como ${t.done ? "pendente" : "concluída"}`, t.leadId);
  render();
}
function addTask(t) {
  state.tasks = [t, ...state.tasks];
  saveSlice("tasks");
  addLogEntry(`Tarefa "${t.t}" criada`, t.leadId);
  toast("Tarefa criada.");
  render();
}

const GCAL_API = "https://www.googleapis.com/calendar/v3";
// Para ligar o envio de e-mail pelo Gmail, acrescentar " https://www.googleapis.com/auth/gmail.send" aqui (ver CLAUDE.md)
const GCAL_SCOPE = "https://www.googleapis.com/auth/calendar.events";
let gisPromise = null;
function carregarGis() {
  if (window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
  if (gisPromise) return gisPromise;
  gisPromise = new Promise((ok, erro) => {
    const sc = document.createElement("script");
    sc.src = "https://accounts.google.com/gsi/client"; sc.async = true;
    sc.onload = ok; sc.onerror = () => { gisPromise = null; erro(new Error("gis")); };
    document.head.appendChild(sc);
  });
  return gisPromise;
}
const gcalConectado = () => !!(ui.gcal && ui.gcal.token && Date.now() < ui.gcal.exp);
const gcalCal = () => encodeURIComponent((state.gcal && state.gcal.calendarId) || "primary");
// Só links do próprio Google viram href (o dado vem da API, mas escapar não basta para o esquema da URL)
const gcalLinkSeguro = (u) => (typeof u === "string" && /^https:\/\/([a-z0-9-]+\.)*google\.com\//i.test(u)) ? u : "";
function gcalRedesenhar() { if (ui.modal) gcalBoxAtualizar(); else render(); }

// A conexão fica fixa porque o servidor (função do Netlify) guarda o token de renovação do Google;
// o navegador só pede um acesso novo quando precisa. Ver netlify/functions/gcal.js.
async function gcalServidor(action, extra) {
  if (!sb) throw new Error("Entre no CRM para conectar o Google Agenda.");
  const { data } = await sb.auth.getSession();
  const jwt = data && data.session && data.session.access_token;
  if (!jwt) throw new Error("Entre no CRM para conectar o Google Agenda.");
  const r = await fetch("/.netlify/functions/gcal", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + jwt }, body: JSON.stringify({ action, ...(extra || {}) }) });
  let b = {}; try { b = await r.json(); } catch (e) {}
  if (!r.ok) { const e = new Error(b.erro || "erro " + r.status); e.status = r.status; throw e; }
  return b;
}
function gcalGuardarToken(b) {
  const lista = ui.gcal ? ui.gcal.lista : null; // renovar o acesso não apaga a lista já carregada
  ui.gcal = { token: b.access_token, exp: Date.now() + (Number(b.expires_in) || 3600) * 1000 - 60000, lista, erro: "", carregando: false };
}
async function gcalRenovar() {
  try { gcalGuardarToken(await gcalServidor("token")); return true; } catch (e) { return false; }
}
function gcalConectar(depois) {
  const id = ((state.gcal && state.gcal.clientId) || "").trim();
  if (!id) { openModal("gcal-config"); return; }
  if (!(window.google && google.accounts && google.accounts.oauth2)) {
    carregarGis().then(() => toast("Pronto. Clique em Conectar de novo.")).catch(() => toast("Não foi possível carregar o Google. Verifique a internet ou o bloqueador de anúncios."));
    return;
  }
  const cc = google.accounts.oauth2.initCodeClient({
    client_id: id, scope: GCAL_SCOPE, ux_mode: "popup", select_account: true, // deixa escolher a conta Google, não só a que já está aberta no navegador
    callback: async (r) => {

// Ao abrir o CRM: pede ao servidor um acesso novo (sem popup). Depois, a cada minuto renova o acesso
// perto de vencer e atualiza a lista a cada 5 min.
async function gcalAutoConectar() {
  if (!(state.gcal && state.gcal.clientId) || !sb) return;
  if (!gcalConectado() && await gcalRenovar()) gcalAtualizar();
  if (gcalAutoTimer) return;
  gcalAutoTimer = setInterval(() => {
    if (!(state.gcal && state.gcal.clientId) || !ui.gcal) return;
    if (Date.now() > ui.gcal.exp - 3 * 60000) gcalRenovar();
    else if (Date.now() - (ui.gcal.ultimo || 0) > 5 * 60000) gcalAtualizar();
  }, 60000);
}
let gcalAutoTimer = null;
// Data local (aaaa-mm-dd) de um evento do Google; dia inteiro vem pronto em start.date
function gcalDataItem(i) {
  if (!i.start) return "";
  if (i.start.date) return i.start.date;
  const d = new Date(i.start.dateTime); if (isNaN(d)) return "";
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
// Eventos do Google a mostrar junto dos do CRM (os criados pelo CRM já estão em state.eventos)
function gcalExternos() {
  if (!gcalConectado() || !ui.gcal.lista) return [];
  const meus = new Set(state.eventos.map(e => e.gcalId).filter(Boolean));
  return ui.gcal.lista.filter(i => !meus.has(i.id));
}
async function gcalApi(path, opts = {}) {
  if (!gcalConectado() && !(await gcalRenovar())) throw new Error("Google Agenda desconectado");
  const chamar = () => fetch(GCAL_API + path, { ...opts, headers: { Authorization: "Bearer " + ui.gcal.token, "Content-Type": "application/json" } });
  let r = await chamar();
  if (r.status === 401 && await gcalRenovar()) r = await chamar();
  if (r.status === 401) { ui.gcal = null; throw new Error("sessão do Google expirou, conecte de novo"); }
  if (!r.ok) { let m = ""; try { m = (await r.json()).error.message; } catch (e) {} throw new Error(m || "erro " + r.status); }
  return r.status === 204 ? null : r.json();
}
async function gcalAtualizar() {
  if (!gcalConectado()) return;
  // do 1º dia do mês (para o calendário mensal) até o fim do mês ou 14 dias à frente, o que for maior
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const ini = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
  const fimMes = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 1);
  const fim = new Date(Math.max(fimMes.getTime(), hoje.getTime() + 14 * 864e5));
  ui.gcal.carregando = true;
  try {
    const d = await gcalApi(`/calendars/${gcalCal()}/events?singleEvents=true&orderBy=startTime&maxResults=250&timeMin=${encodeURIComponent(ini.toISOString())}&timeMax=${encodeURIComponent(fim.toISOString())}`);
    ui.gcal.lista = (d.items || []).filter(i => i.status !== "cancelled"); ui.gcal.erro = ""; ui.gcal.ultimo = Date.now();
  } catch (e) { if (ui.gcal) ui.gcal.erro = e.message; else toast("A sessão do Google expirou. Conecte de novo."); }
  if (ui.gcal) ui.gcal.carregando = false;
  if ((ui.view === "agenda" || ui.view === "dashboard") && !ui.modal) render();
}
async function gcalCriar(ev, op) {
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const ini = new Date(`${ev.data}T${ev.hora}:00`), fim = new Date(ini.getTime() + ev.duracao * 60000);
  const lead = state.leads.find(l => l.id === ev.leadId);
  const corpo = {
    summary: ev.titulo,
    description: [ev.tipo, lead ? "Lead: " + lead.nome : ""].filter(Boolean).join(" · ") + "\n(Criado pelo CRM Viver de Shopee)",
    start: { dateTime: ini.toISOString(), timeZone: tz }, end: { dateTime: fim.toISOString(), timeZone: tz },
  };
  if (ev.local) corpo.location = ev.local;
  const mailOk = lead && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(lead.email || "");
  if (op.convidar && mailOk) corpo.attendees = [{ email: lead.email, displayName: lead.nome }];
  if (op.meet) corpo.conferenceData = { createRequest: { requestId: (crypto.randomUUID ? crypto.randomUUID() : "r" + Date.now() + Math.random()), conferenceSolutionKey: { type: "hangoutsMeet" } } };
  return gcalApi(`/calendars/${gcalCal()}/events?conferenceDataVersion=1&sendUpdates=${op.convidar && mailOk ? "all" : "none"}`, { method: "POST", body: JSON.stringify(corpo) });
}
async function gcalEditar(gid, ev) {

  state.convs = state.convs.map(c => c.id === convId ? { ...c, time: "agora", msgs: [...c.msgs, full], aguardandoHumano: msg.auto ? c.aguardandoHumano : false } : c);

async function sendChatMessage(convId, text) {
  const m = (text || "").trim(); if (!m) return;

  if (PREVIEW_SEM_LOGIN) {
    const full = { t: "out", h: "agora", s: "sent", kind: "text", txt: m };
    state.convs = state.convs.map(c => c.id === convId ? { ...c, time: "agora", msgs: [...c.msgs, full] } : c);
    render();
    return;
  }

  const tempMsg = { t: "out", h: "agora", s: "sending", kind: "text", txt: m };
  state.convs = state.convs.map(c => c.id === convId ? { ...c, msgs: [...c.msgs, tempMsg] } : c);
  render();
  try {
    await api.conversations.sendText(convId, m);
    await loadConversationMessages(convId); // recarrega com hora/status confirmados pelo servidor
  } catch (e) {
    toast(e.message || "Não foi possível enviar a mensagem.");
    state.convs = state.convs.map(c => c.id === convId ? { ...c, msgs: c.msgs.filter(mm => mm !== tempMsg) } : c);
    render();
  }
}

    addLogEntry(`Lead "${nl.nome}" criado e movido para "${stageOf(stageId).nome}" pela automação`, nl.id);

function flagAguardandoHumano(convId, motivoRegra) {
  state.convs = state.convs.map(c => c.id === convId ? { ...c, aguardandoHumano: true } : c);
  saveSlice("convs");

function runAutomation(convId, incomingText) {
  if (!state.automacaoAtiva) return; // desligada = não faz nada, por padrão
  const conv = state.convs.find(c => c.id === convId);
  if (!conv) return;
  const inCount = conv.msgs.filter(m => m.t === "in").length;
  const regra = state.automacao.find(r => {
    if (!r.ativo) return false;
    if (r.gatilho === "primeira_mensagem") return inCount === 1;
    if (r.gatilho === "palavra_chave") return r.palavra && incomingText.toLowerCase().includes(r.palavra.toLowerCase());
    return false;
  });
  if (!regra) return;
  setTimeout(() => {
    if (regra.resposta) appendOutMessage(convId, { kind: "text", txt: regra.resposta, auto: true });
    if (regra.moverParaEtapa) applyStageFromAutomation(convId, regra.moverParaEtapa);
    if (regra.notificarHumano) flagAguardandoHumano(convId, regra.nome);
    addLogEntry(`Resposta automática enviada ("${regra.nome}")`, conv.leadId);
    render();
  }, 850);
}

// do cliente, e dispara a automação — sem isso, testar exigiria conectar
// a API real do WhatsApp primeiro.
function simulateIncomingMessage(convId, text) {
  const m = (text || "").trim(); if (!m) return;
  state.convs = state.convs.map(c => c.id === convId ? { ...c, time: "agora", msgs: [...c.msgs, { t: "in", txt: m, h: "agora", s: "read" }] } : c);

  runAutomation(convId, m);
}

/* ---------- Notificações: "cliente aguardando atendimento humano" ----------
   Como os dados sincronizam via Firebase em tempo real, qualquer pessoa da
   equipe com o CRM aberto — em qualquer aparelho — recebe a notificação
   sozinha quando alguém marca uma conversa como aguardando humano. */
let notifiedWaitingIds = new Set();
function checkForHumanNotifications(prevConvs, newConvs) {
  (newConvs || []).forEach(c => {
    const eraAntes = (prevConvs || []).find(p => p.id === c.id);
    if (c.aguardandoHumano && !notifiedWaitingIds.has(c.id) && (!eraAntes || !eraAntes.aguardandoHumano)) {
      notifiedWaitingIds.add(c.id);
      notifyHumanNeeded(c);
    }
    if (!c.aguardandoHumano) notifiedWaitingIds.delete(c.id);
  });
}
function notifyHumanNeeded(conv) {
  playBeep();
  try {
    if (typeof Notification !== "undefined" && Notification.permission === "granted") {
      new Notification("Cliente aguardando atendimento 👋", { body: `${conv.nome} está esperando um atendente assumir a conversa.` });
    }
  } catch (e) {}
}
function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine"; o.frequency.value = 880;
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    o.start(); o.stop(ctx.currentTime + 0.42);
    setTimeout(() => ctx.close(), 500);
  } catch (e) {}
}
function requestNotificationPermission() {
  if (typeof Notification === "undefined") { toast("Este navegador não tem suporte a notificações."); return; }
  Notification.requestPermission().then(perm => {
    toast(perm === "granted" ? "Notificações ativadas." : "Notificações não autorizadas pelo navegador.");
    render();
  });
}

/* ---------- Anexos reais: fotos (comprimidas no navegador), arquivos, áudio ----------
   Fotos e áudios curtos ficam de verdade dentro da conversa (sincronizados como
   todo o resto). Arquivos grandes só guardam nome/tamanho — pra não pesar a
   sincronização — com aviso pra enviar o arquivo de verdade pelo WhatsApp real. */
const MAX_IMG_DIM = 1000;
const MAX_EMBED_BYTES = 350 * 1024;
function fmtBytes(n) { return n < 1024 ? n + " B" : n < 1024 * 1024 ? (n / 1024).toFixed(0) + " KB" : (n / 1024 / 1024).toFixed(1) + " MB"; }
function fileToDataUrl(file) {
  return new Promise((resolve, reject) => { const r = new FileReader(); r.onload = e => resolve(e.target.result); r.onerror = reject; r.readAsDataURL(file); });
}
function compressImageFile(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) { const r = Math.min(maxDim / width, maxDim / height); width = Math.round(width * r); height = Math.round(height * r); }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality || 0.72));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function handleChatFiles(convId, files) {
  for (const file of Array.from(files)) {
    try {
      if (file.type.startsWith("image/")) {
        const dataUrl = await compressImageFile(file, MAX_IMG_DIM, 0.72);
        appendOutMessage(convId, { kind: "image", mediaUrl: dataUrl, txt: "" });
      } else if (file.type.startsWith("audio/")) {
        const dataUrl = await fileToDataUrl(file);
        appendOutMessage(convId, { kind: "audio", mediaUrl: dataUrl });
      } else if (file.size > MAX_EMBED_BYTES) {
        appendOutMessage(convId, { kind: "file", fileName: file.name, fileSize: fmtBytes(file.size), mediaUrl: null });
        toast("Arquivo grande demais para anexar aqui — registrado só o nome. Envie o arquivo de verdade pelo WhatsApp real.");
      } else {
        const dataUrl = await fileToDataUrl(file);
        appendOutMessage(convId, { kind: "file", fileName: file.name, fileSize: fmtBytes(file.size), mediaUrl: dataUrl });
      }
    } catch (e) {
      toast("Não foi possível anexar " + file.name);
    }
  }
}

/* ---------- Gravação de áudio (microfone real do aparelho) ---------- */
let mediaRecorder = null, recordedChunks = [], recordingConvId = null, recordingTimerHandle = null;
function blobToDataUrl(blob) {
  return new Promise((resolve, reject) => { const r = new FileReader(); r.onload = e => resolve(e.target.result); r.onerror = reject; r.readAsDataURL(blob); });
}
async function startRecording(convId) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast("Este navegador não permite gravar áudio."); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recordedChunks = []; recordingConvId = convId;
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      clearInterval(recordingTimerHandle);
      const wasCancelled = ui.recordingCancelled;
      ui.recording = false; ui.recordingCancelled = false;
      if (!wasCancelled && recordedChunks.length) {
        const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || "audio/webm" });
        const dataUrl = await blobToDataUrl(blob);
        appendOutMessage(recordingConvId, { kind: "audio", mediaUrl: dataUrl });
      } else {
        render();
      }
    };
    mediaRecorder.start();
    ui.recording = true; ui.recordingSeconds = 0; ui.recordingCancelled = false;
    render();
    recordingTimerHandle = setInterval(() => {
      ui.recordingSeconds++;
      const el = document.getElementById("recTimer");
      if (el) el.textContent = Math.floor(ui.recordingSeconds / 60) + ":" + String(ui.recordingSeconds % 60).padStart(2, "0");
      if (ui.recordingSeconds >= 120) stopRecording();
    }, 1000);
  } catch (e) {
    toast("Não foi possível acessar o microfone — verifique a permissão do navegador.");
  }
}
function stopRecording() { if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop(); }
function cancelRecording() { ui.recordingCancelled = true; if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop(); }

/* ---------- Gráficos em SVG puro (sem biblioteca externa) ---------- */
function svgDonut(slices, size, thickness) {
  size = size || 160; thickness = thickness || 22;
  const total = slices.reduce((a, s) => a + s.value, 0);
  const r = size / 2, rInner = r - thickness, cx = r, cy = r;
  if (!total) return `<svg width="${size}" height="${size}"><circle cx="${cx}" cy="${cy}" r="${rInner + thickness / 2}" fill="none" stroke="var(--surface-2)" stroke-width="${thickness}"/></svg>`;
  let a0 = -Math.PI / 2, paths = "";
  slices.forEach(s => {
    if (!s.value) return;
    const a1 = a0 + (s.value / total) * Math.PI * 2;
    const large = (a1 - a0) > Math.PI ? 1 : 0;
    const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    const xi0 = cx + rInner * Math.cos(a1), yi0 = cy + rInner * Math.sin(a1);
    const xi1 = cx + rInner * Math.cos(a0), yi1 = cy + rInner * Math.sin(a0);
    const d = `M${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)} L${xi0.toFixed(2)},${yi0.toFixed(2)} A${rInner},${rInner} 0 ${large} 0 ${xi1.toFixed(2)},${yi1.toFixed(2)} Z`;
    paths += `<path d="${d}" fill="${s.color}"/>`;
    a0 = a1;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${paths}</svg>`;
}
function ringPct(pct, size) {
  size = size || 150;
  const thickness = 14, r = size / 2, rInner = r - thickness, cx = r, cy = r;
  const a0 = -Math.PI / 2, a1 = a0 + Math.min(1, Math.max(0, pct / 100)) * Math.PI * 2;
  const large = (a1 - a0) > Math.PI ? 1 : 0;
  const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
  const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
  const xi0 = cx + rInner * Math.cos(a1), yi0 = cy + rInner * Math.sin(a1);
  const xi1 = cx + rInner * Math.cos(a0), yi1 = cy + rInner * Math.sin(a0);
  const fg = pct > 0 ? `<path d="M${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)} L${xi0.toFixed(2)},${yi0.toFixed(2)} A${rInner},${rInner} 0 ${large} 0 ${xi1.toFixed(2)},${yi1.toFixed(2)} Z" fill="var(--brand)"/>` : "";
  return `<div style="position:relative;width:${size}px;height:${size}px;margin:6px auto">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${cx}" cy="${cy}" r="${rInner + thickness / 2}" fill="none" stroke="var(--surface-2)" stroke-width="${thickness}"/>${fg}
    </svg>
    <div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center">
      <div><div class="mono" style="font-size:30px;font-weight:700">${Math.round(pct)}%</div><div style="font-size:11px;color:var(--text-3)">da meta</div></div>
    </div></div>`;
}
function barListH(items, fmt) {
  const max = Math.max(1, ...items.map(i => i.value));
  return items.map(i => `<div style="display:flex;align-items:center;gap:10px;padding:7px 0">
    <div style="width:110px;flex-shrink:0;font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(i.label)}</div>
    <div class="bar-track" style="flex:1;margin-top:0"><div class="bar-fill" style="width:${(i.value / max * 100).toFixed(1)}%;background:${i.color || "var(--brand)"}"></div></div>
    <div class="mono" style="width:70px;text-align:right;font-size:12px;font-weight:600;flex-shrink:0">${fmt ? fmt(i.value) : i.value}</div>
  </div>`).join("");
}
function barChartV(items, fmt) {
  const max = Math.max(1, ...items.map(i => i.value));
  return `<div style="display:flex;align-items:flex-end;gap:8px;height:170px;padding:0 6px">
    ${items.map(i => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end">
      <div class="mono" style="font-size:10.5px;color:var(--text-3)">${fmt ? fmt(i.value) : i.value}</div>
      <div style="width:100%;max-width:34px;border-radius:6px 6px 0 0;background:${i.color || "var(--brand)"};height:${Math.max(4, i.value / max * 130)}px"></div>
      <div style="font-size:9.5px;color:var(--text-3);text-align:center;line-height:1.2">${esc(i.label)}</div>
    </div>`).join("")}
  </div>`;
}

/* ---------- Atendimento (Central de WhatsApp) ---------- */
function convPreviewText(c) {
  const m = c.msgs[c.msgs.length - 1];
  if (!m) return "Sem mensagens ainda";
  if (m.kind === "image") return "📷 Foto";
  if (m.kind === "audio") return "🎤 Mensagem de voz";
  if (m.kind === "file") return "📎 " + (m.fileName || "Arquivo");
  if (m.kind === "call") return (m.video ? "🎥 " : "📞 ") + m.txt;
  return m.txt || "";
}
function renderBubble(m) {
  const meta = `<div class="bub-meta">${m.s === "sending" ? "enviando..." : m.h}${m.t === "out" && m.s !== "sending" ? icon("check", 13) : ""}</div>`;
  if (m.kind === "image") return `<div class="bub ${m.t}" style="padding:6px 6px 4px"><img src="${m.mediaUrl}" style="max-width:250px;width:100%;border-radius:9px;display:block" />${m.txt ? `<div style="padding:6px 4px 0">${esc(m.txt)}</div>` : ""}${meta}</div>`;
  if (m.kind === "audio") return `<div class="bub ${m.t}"><audio controls src="${m.mediaUrl}" style="width:230px;height:38px;display:block"></audio>${meta}</div>`;
  if (m.kind === "file") return `<div class="bub ${m.t}"><div style="display:flex;align-items:center;gap:10px;min-width:180px">
      <div style="width:36px;height:36px;border-radius:9px;background:var(--brand-weak);color:var(--brand);display:grid;place-items:center;flex-shrink:0">${icon("file-text", 18)}</div>
      <div style="min-width:0;flex:1"><div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px">${esc(m.fileName)}</div><div style="font-size:11px;color:var(--text-3)">${esc(m.fileSize)}</div></div>
      ${m.mediaUrl ? `<a href="${m.mediaUrl}" download="${esc(m.fileName)}" class="icon-btn" style="width:30px;height:30px">${icon("download", 15)}</a>` : ""}</div>${meta}</div>`;
  if (m.kind === "call") return `<div class="bub ${m.t}"><div style="display:flex;align-items:center;gap:8px;margin-bottom:${m.inviteUrl ? "6px" : "0"}"><span style="color:var(--brand)">${icon(m.video ? "video" : "phone", 16)}</span><span style="font-weight:600">${esc(m.txt)}</span></div>
      ${m.inviteUrl ? `<a href="${m.inviteUrl}" target="_blank" rel="noreferrer" style="font-size:12px;color:var(--brand);text-decoration:underline">Convidar cliente pelo WhatsApp</a>` : ""}${meta}</div>`;
  return `<div class="bub ${m.t}">${esc(m.txt)}${meta}</div>`;
}

/* ---------- Agenda ---------- */
// Data local de hoje (aaaa-mm-dd); o TODAY_STR é UTC e vira o dia seguinte à noite
function hojeLocalStr() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
// Compromissos de hoje do CRM + os que estão só no Google, em ordem de horário (usado no Painel)
function agendaHojeLista() {
  const h = hojeLocalStr();
  return [
    ...state.eventos.filter(e => e.data === h).map(e => ({ hora: e.hora || "00:00", titulo: e.titulo, tipo: e.tipo, cor: TYPE_COLOR[e.tipo] || "var(--brand)" })),
    ...gcalExternos().filter(i => gcalDataItem(i) === h).map(i => ({ hora: i.start.dateTime ? new Date(i.start.dateTime).toTimeString().slice(0, 5) : "Dia todo", titulo: i.summary || "(sem título)", tipo: "Google Agenda", cor: "var(--sky)" })),
  ].sort((a, b) => (a.hora === "Dia todo" ? "00:00" : a.hora).localeCompare(b.hora === "Dia todo" ? "00:00" : b.hora));
}
const AG_BTN = 'class="icon-btn" style="width:30px;height:30px"';
function agendaLinhaCrm(e, leadName) {
  const cor = TYPE_COLOR[e.tipo] || "var(--brand)";
  return `<div class="act-row"><span class="act-time">${esc(e.hora)}</span><span class="act-dot" style="background:${cor}"></span>
    <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:500;overflow-wrap:anywhere">${esc(e.titulo)}</div>
      <div style="display:flex;gap:6px;margin-top:4px;flex-wrap:wrap"><span class="chip" style="background:${cor}1a;color:${cor}">${esc(e.tipo)}</span>${e.leadId && leadName(e.leadId) ? `<span class="chip" style="background:var(--surface-2);color:var(--text-2)">${esc(leadName(e.leadId))}</span>` : ""}</div></div>
    <button ${AG_BTN} title="Editar compromisso" data-action="event-edit" data-event-id="${esc(e.id)}">${icon("edit-2", 15)}</button>
    <button ${AG_BTN} title="Abrir no Google Agenda" data-action="event-gcal" data-event-id="${esc(e.id)}">${icon("external-link", 15)}</button>
    ${gcalLinkSeguro(e.meet) ? `<a ${AG_BTN} title="Entrar no Google Meet" href="${esc(e.meet)}" target="_blank" rel="noopener noreferrer">${icon("video", 15)}</a>` : ""}
    <button ${AG_BTN} title="Baixar .ics" data-action="event-ics" data-event-id="${esc(e.id)}">${icon("download", 15)}</button>
    <button ${AG_BTN} title="Excluir compromisso" data-action="event-delete" data-event-id="${esc(e.id)}">${icon("trash-2", 15)}</button></div>`;
}
// Evento que existe só no Google Agenda; dia inteiro não edita aqui (só abrir/excluir)
function agendaLinhaGoogle(i) {
  const hr = i.start.dateTime ? new Date(i.start.dateTime).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) : "Dia todo";
  const meet = gcalLinkSeguro(i.hangoutLink), abrir = gcalLinkSeguro(i.htmlLink);
  return `<div class="act-row"><span class="act-time">${esc(hr)}</span><span class="act-dot" style="background:var(--sky)"></span>
    <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:500;overflow-wrap:anywhere">${esc(i.summary || "(sem título)")}</div>
      <div style="margin-top:4px"><span class="chip" style="background:var(--surface-2);color:var(--text-2)">Google Agenda</span></div></div>
    ${i.start.dateTime ? `<button ${AG_BTN} title="Editar compromisso" data-action="gevent-edit" data-gid="${esc(i.id)}">${icon("edit-2", 15)}</button>` : ""}
    ${meet ? `<a ${AG_BTN} title="Entrar no Google Meet" href="${esc(meet)}" target="_blank" rel="noopener noreferrer">${icon("video", 15)}</a>` : ""}
    ${abrir ? `<a ${AG_BTN} title="Abrir no Google Agenda" href="${esc(abrir)}" target="_blank" rel="noopener noreferrer">${icon("external-link", 15)}</a>` : ""}
    <button ${AG_BTN} title="Excluir do Google Agenda" data-action="gevent-delete" data-gid="${esc(i.id)}">${icon("trash-2", 15)}</button></div>`;
}

function renderAgenda() {
  const d0 = new Date(), hojeStr = d0.getFullYear() + "-" + String(d0.getMonth() + 1).padStart(2, "0") + "-" + String(d0.getDate()).padStart(2, "0");
  const eventos = state.eventos;
  const leadName = (id) => state.leads.find(l => l.id === id)?.nome;
  const dias = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
  const byDay = {}; eventos.forEach(e => { const d = Number(e.data.split("-")[2]); (byDay[d] = byDay[d] || []).push(e); });
  const externos = gcalExternos(); // eventos que estão só no Google Agenda
  const prefMes = hojeStr.slice(0, 7);
  externos.forEach(i => { const ds = gcalDataItem(i); if (ds.startsWith(prefMes)) (byDay[Number(ds.slice(8, 10))] = byDay[Number(ds.slice(8, 10))] || []).push({ tipo: "Google" }); });
  // só os de hoje, em ordem de horário (data local, não UTC: à noite o UTC já é o dia seguinte)
  const todos = [
    ...eventos.filter(e => e.data === hojeStr).map(e => ({ h: e.hora || "00:00", html: agendaLinhaCrm(e, leadName) })),
    ...externos.filter(i => gcalDataItem(i) === hojeStr).map(i => ({ h: i.start.dateTime ? new Date(i.start.dateTime).toTimeString().slice(0, 5) : "00:00", html: agendaLinhaGoogle(i) })),
  ].sort((a, b) => a.h.localeCompare(b.h));
  const listaAgenda = todos.length ? todos.map(x => x.html).join("") : `<div style="padding:24px 18px;text-align:center;color:var(--text-3);font-size:13px">Nada agendado para hoje.</div>`;
  const todayNum = Number(hojeStr.split("-")[2]);
  const daysInMonth = new Date(Number(hojeStr.slice(0, 4)), Number(hojeStr.slice(5, 7)), 0).getDate();
  const firstWeekday = new Date(hojeStr.slice(0, 7) + "-01").getDay();
  let cells = "";
  for (let i = 0; i < firstWeekday; i++) cells += `<div></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const has = byDay[d]; const isToday = d === todayNum;
    cells += `<div style="aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:600;cursor:pointer;background:${isToday ? "var(--brand)" : "transparent"};color:${isToday ? "#fff" : "var(--text)"};border:1px solid ${isToday ? "var(--brand)" : "transparent"}">
      ${d}<div style="display:flex;gap:2px">${(has || []).slice(0, 4).map(ev => `<span style="width:5px;height:5px;border-radius:50%;background:${isToday ? "#fff" : (TYPE_COLOR[ev.tipo] || "var(--brand)")}"></span>`).join("")}</div></div>`;
  }
  return `<div class="page">
    <div class="page-head"><div><div class="page-title display">Agenda</div><div class="page-sub">${eventos.length} compromissos cadastrados</div></div>
      <div class="head-actions"><button class="btn btn-g">${icon("chevron-left", 16)}</button><button class="btn btn-g">${icon("chevron-right", 16)}</button>
        <button class="btn btn-p" data-action="open-modal" data-modal="compromisso">${icon("plus", 16)}Compromisso</button></div></div>
    ${gcalCardHtml()}
    <div class="grid2">
      <div class="card" style="padding:18px"><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">
        ${dias.map(d => `<div style="text-align:center;font-size:11px;font-weight:700;color:var(--text-3);padding:4px 0">${d}</div>`).join("")}${cells}
      </div></div>
      <div class="card"><div class="card-h"><div class="card-t">Compromissos de hoje</div><span class="chip" style="background:var(--surface-2);color:var(--text-2)">${todos.length}</span></div>
        <div style="margin-top:8px;max-height:620px;overflow-y:auto">${listaAgenda}</div></div>
    </div></div>`;
}

/* ---------- Relatórios ---------- */
function renderRelatorios() {
  const leads = state.leads, equipe = state.equipe, convs = state.convs;
  const total = leads.length;
  if (total === 0) {
    return `<div class="page"><div class="page-head"><div><div class="page-title display">Relatórios</div><div class="page-sub">Desempenho comercial e produtividade</div></div></div>
      <div class="card" style="padding:44px;text-align:center;color:var(--text-3)">${icon("bar-chart-3", 30)}<div style="font-size:13.5px;margin-top:12px">Os relatórios aparecem aqui assim que você tiver leads cadastrados.</div></div></div>`;
  }
  const fechados = leads.filter(l => l.stage === "fechado");
  const conversao = Math.round(fechados.length / total * 1000) / 10;
  const ticketMedio = fechados.length ? Math.round(fechados.reduce((a, l) => a + l.valor, 0) / fechados.length) : 0;
  const ativosNoFunil = leads.filter(l => !["fechado", "perdido"].includes(l.stage)).length;
  const vendasPorConsultor = equipe.map((nome, i) => ({ label: nome.split(" ")[0], value: leads.filter(l => l.resp === nome && l.stage === "fechado").reduce((a, l) => a + l.valor, 0), color: AV[i % AV.length] }));
  const origMap = {}; leads.forEach(l => { if (!origMap[l.origem]) origMap[l.origem] = { total: 0, fechados: 0 }; origMap[l.origem].total++; if (l.stage === "fechado") origMap[l.origem].fechados++; });
  const origens = Object.entries(origMap).map(([name, v]) => ({ label: name, value: Math.round(v.fechados / v.total * 100), color: "var(--ok)" }));
  const kpi = (i, cor, label, value) => `<div class="kpi"><div class="kpi-top"><div class="kpi-ic" style="background:${cor}1f;color:${cor}">${icon(i, 18)}</div></div><div class="kpi-lbl">${label}</div><div class="kpi-val">${value}</div></div>`;
  return `<div class="page"><div class="page-head"><div><div class="page-title display">Relatórios</div><div class="page-sub">Desempenho comercial e produtividade — calculado sobre os dados atuais</div></div></div>
    <div class="kgrid">${kpi("target", "#4A5BF6", "Taxa de Conversão", conversao.toLocaleString("pt-BR") + "%")}${kpi("kanban-square", "#0EA5E9", "Ativos no Funil", num(ativosNoFunil))}${kpi("dollar-sign", "#12A971", "Ticket Médio (fechados)", brl(ticketMedio))}${kpi("message-circle", "#8B5CF6", "Conversas Registradas", num(convs.length))}</div>
    <div class="grid2">
      <div class="card"><div class="card-h"><div class="card-t">Receita Fechada por Consultor</div></div>
        ${equipe.length === 0 ? `<div style="padding:30px;text-align:center;font-size:12.5px;color:var(--text-3)">Cadastre sua equipe em Usuários.</div>` : `<div style="padding:16px 14px">${barChartV(vendasPorConsultor, brlk)}</div>`}</div>
      <div class="card"><div class="card-h"><div class="card-t">Conversão por Origem</div></div>
        <div style="padding:16px 18px">${barListH(origens, v => v + "%")}</div></div>
    </div></div>`;
}

const imgSegura = (u) => typeof u === "string" && u.length < 900000 && /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+\/=]+$/.test(u);
function formLuminancia(h) {
  const n = parseInt(h.slice(1), 16), f = (x) => { x /= 255; return x <= .03928 ? x / 12.92 : Math.pow((x + .055) / 1.055, 2.4); };
  return .2126 * f((n >> 16) & 255) + .7152 * f((n >> 8) & 255) + .0722 * f(n & 255);
}
function formVisualVars(v) {
  const marca = formHex(v.corMarca, FORM_VISUAL_PADRAO.corMarca), fundo = formHex(v.corFundo, FORM_VISUAL_PADRAO.corFundo), texto = formHex(v.corTexto, FORM_VISUAL_PADRAO.corTexto);
  return {
    "--bg": fundo, "--text": texto, "--brand": marca,
    "--brand-hover": `color-mix(in srgb, ${marca} 85%, ${texto})`, "--brand-weak": `color-mix(in srgb, ${marca} 16%, transparent)`,
    "--surface": `color-mix(in srgb, ${texto} 7%, ${fundo})`, "--surface-2": `color-mix(in srgb, ${texto} 11%, ${fundo})`,
    "--border": `color-mix(in srgb, ${texto} 10%, transparent)`, "--border-strong": `color-mix(in srgb, ${texto} 20%, transparent)`,
    "--text-2": `color-mix(in srgb, ${texto} 62%, transparent)`, "--text-3": `color-mix(in srgb, ${texto} 40%, transparent)`,
    "--on-brand": formLuminancia(marca) > .5 ? "#111111" : "#ffffff",
  };
}
function fvPreviewStyle(v) {
