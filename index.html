  let bg = "var(--bg)";
  if (v.fundo === "imagem" && imgSegura(v.fundoImagem)) {

}

// Reduz a imagem antes de guardar: a configuração é baixada por todo visitante do formulário.
function redimensionarImagem(file, maxLado, tipo, qualidade) {
  return new Promise((ok, erro) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, maxLado / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
      const ctx = c.getContext("2d");
      if (tipo === "image/jpeg") { ctx.fillStyle = "#000"; ctx.fillRect(0, 0, c.width, c.height); }
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL(tipo, qualidade));
    };
    img.onerror = () => { URL.revokeObjectURL(url); erro(new Error("imagem inválida")); };
    img.src = url;
  });
}
async function carregarImagemForm(file, isLogo) {
  if (!/^image\/(png|jpeg|webp)$/.test(file.type)) { toast("Use uma imagem PNG, JPG ou WEBP."); return; }
  if (file.size > 12 * 1024 * 1024) { toast("Imagem muito grande (máximo 12 MB)."); return; }
  try {
    const uri = await redimensionarImagem(file, isLogo ? 400 : 1600, isLogo ? "image/png" : "image/jpeg", 0.78);
    if (!imgSegura(uri)) { toast("A imagem ficou grande demais. Tente uma menor."); return; }
    ui.fv[isLogo ? "logoUrl" : "fundoImagem"] = uri;
    atualizarPreviewForm();
  } catch (e) { toast("Não foi possível ler essa imagem."); }
}

// Recorta no formato de cartão (1200x630) e comprime: o WhatsApp prefere imagens leves.
function recortarImagemCartao(file) {
  return new Promise((ok, erro) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const W = 1200, H = 630, k = Math.max(W / img.width, H / img.height);
      const c = document.createElement("canvas"); c.width = W; c.height = H;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
      ctx.drawImage(img, (W - img.width * k) / 2, (H - img.height * k) / 2, img.width * k, img.height * k);
      URL.revokeObjectURL(url);
      let q = 0.8, uri = c.toDataURL("image/jpeg", q);
      while (uri.length > 300000 && q > 0.4) { q -= 0.1; uri = c.toDataURL("image/jpeg", q); }
      ok(uri);
    };
    img.onerror = () => { URL.revokeObjectURL(url); erro(new Error("imagem inválida")); };
    img.src = url;
  });
}
async function carregarImagemCartao(file) {
  if (!/^image\/(png|jpeg|webp)$/.test(file.type)) { toast("Use uma imagem PNG, JPG ou WEBP."); return; }
  if (file.size > 12 * 1024 * 1024) { toast("Imagem muito grande (máximo 12 MB)."); return; }
  try {
    const uri = await recortarImagemCartao(file);
    if (!imgSegura(uri)) { toast("A imagem ficou grande demais. Tente uma menor."); return; }
    ui.fs.imagem = uri; atualizarPreviewCartao();
  } catch (e) { toast("Não foi possível ler essa imagem."); }
}

async function loadFormBuilderData() {
  ui.formularioLoading = true; state.formErro = ""; render();
  if (!sb || !sbSession) {
    ui.formularioLoading = false; state.formErro = "Entre com a sua conta para gerenciar o formulário."; render(); return;
  }
  try {
    const [cfg, resp] = await Promise.all([
      sb.from("formularios").select("config").eq("slug", FORM_KEY).maybeSingle(),
      sb.from("form_respostas").select("*").eq("slug", FORM_KEY).order("created_at", { ascending: false }).limit(200),
    ]);
    if (cfg.error) throw cfg.error;
    state.formConfig = cfg.data ? cfg.data.config : null;
    state.formRespostas = resp.error ? [] : resp.data;
  } catch (e) {
    state.formErro = "Não foi possível carregar o formulário (" + (e.message || e) + "). Confira se o supabase/schema.sql atualizado foi executado no Supabase.";
  }
  ui.formularioLoading = false; render();
}

/* Aplica a mudança na tela na hora e grava; se o banco recusar, volta ao que era. */
async function mutarFormConfig(fn, msg) {
  const antes = state.formConfig;
  const novo = JSON.parse(JSON.stringify(antes));
  fn(novo);
  state.formConfig = novo; render();
  const { error } = await sb.from("formularios").upsert({ slug: FORM_KEY, config: novo });
  if (error) { state.formConfig = antes; render(); showErrorBanner("O formulário não foi salvo: " + error.message); return false; }
  if (msg) toast(msg);
  return true;
}

// Resposta guardada (id da opção ou texto) -> texto legível para a tela e o CSV.
function formRespostaTexto(q, v) {
  if (v === undefined || v === null || v === "") return "";
  if (FORM_SELECT_TYPES.includes(q.tipo)) {
    const ids = Array.isArray(v) ? v : [v];
    return ids.map(id => (q.opcoes.find(o => o.id === id) || {}).label || "").filter(Boolean).join(", ");
  }
  return String(v);
}

}

function renderQuestionCard(q, i, total) {
  const isSelect = FORM_SELECT_TYPES.includes(q.tipo);
  const smallBtn = (extra) => `style="width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border);flex-shrink:0;cursor:pointer" ${extra}`;
  const opcoes = q.opcoes || [];
  return `<div class="card" style="padding:16px 18px">
    <div style="display:flex;align-items:flex-start;gap:12px">
      <div style="width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--text-2);flex-shrink:0;margin-top:1px">${i + 1}</div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px">
          <span class="badge" style="background:var(--brand-weak);color:var(--brand);font-size:11px">${esc(FORM_TYPE_LABELS[q.tipo] || q.tipo)}</span>
          ${q.obrigatoria ? `<span class="badge" style="background:var(--warn-weak);color:var(--warn);font-size:11px">Obrigatória</span>` : ""}
          ${q.grupo ? `<span class="badge" style="font-size:11px">Tela: ${esc(q.grupo)}</span>` : ""}
          ${q.campo ? `<span class="badge" style="background:var(--ok-weak);color:var(--ok);font-size:11px">→ ${esc(FORM_CAMPOS[q.campo] || q.campo)}</span>` : ""}
        </div>
        <div style="font-weight:700;font-size:14.5px;overflow-wrap:anywhere">${esc(q.pergunta)}</div>
        ${q.descricao ? `<div style="font-size:12px;color:var(--text-2);margin-top:2px">${esc(q.descricao)}</div>` : ""}
        ${isSelect ? `<div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:10px">${opcoes.map(o => `<span class="chip" style="background:var(--surface-2);color:var(--text-2)">${esc(o.label)}${Number(o.pontos) ? ` <b style="color:var(--brand)">+${esc(o.pontos)}</b>` : ""}</span>`).join("")}</div>` : ""}
      </div>
      <div style="display:flex;gap:4px;flex-shrink:0">
        <button ${smallBtn(`data-action="form-move-question" data-dir="up" data-id="${esc(q.id)}" ${i === 0 ? "disabled" : ""} title="Mover para cima"`)}>${icon("chevron-up", 13)}</button>
        <button ${smallBtn(`data-action="form-move-question" data-dir="down" data-id="${esc(q.id)}" ${i === total - 1 ? "disabled" : ""} title="Mover para baixo"`)}>${icon("chevron-down", 13)}</button>
        <button ${smallBtn(`data-action="form-edit-question" data-id="${esc(q.id)}" title="Editar"`)}>${icon("edit-2", 13)}</button>
        <button ${smallBtn(`data-action="form-delete-question" data-id="${esc(q.id)}" title="Excluir"`)}>${icon("trash-2", 13)}</button>
      </div>
    </div>
  </div>`;
}

/* ============================== MODAIS ==============================
   Construídos uma única vez ao abrir (não são reconstruídos a cada
   render() global) — assim o usuário nunca perde o foco/cursor enquanto
   digita. Valores são lidos do DOM só na hora de salvar. */
function modalWrap(id, title, iconName, bodyHtml, footHtml) {
  return `<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox">
    <div class="modal-h"><div style="width:34px;height:34px;border-radius:9px;background:var(--brand-weak);color:var(--brand);display:grid;place-items:center;flex-shrink:0">${icon(iconName, 17)}</div>
      <div class="modal-t" style="flex:1">${title}</div><button class="icon-btn" data-action="close-modal">${icon("x", 18)}</button></div>
    <div class="modal-body">${bodyHtml}</div>
    <div class="modal-foot">${footHtml}</div>
  </div></div>`;
}
function closeModal() { $("#modalRoot").innerHTML = ""; ui.modal = null; ui.modalCtx = null; }
function openModal(type, ctx) {
  ui.modal = type; ui.modalCtx = ctx || null;
  const builders = { lead: () => modalNovoLead(false), cliente: () => modalNovoLead(true), "lead-edit": () => modalNovoLead(false, ctx), nota: () => modalNota(ctx), "nota-edit": () => modalNota(null, ctx), tarefa: () => modalNovaTarefa(ctx), "tarefa-edit": () => modalNovaTarefa(null, ctx), compromisso: () => modalCompromisso(), "compromisso-edit": () => modalCompromisso(ctx), conversa: () => modalNovaConversa(), etapas: () => modalEtapas(), "wa-connect": () => modalWaConnect(), "form-preview": () => modalFormPreview(), "gcal-config": () => modalGcalConfig(), email: () => modalEmail(ctx), "form-question-new": () => modalFormQuestion(null), "form-question-edit": () => modalFormQuestion(ctx) };
  $("#modalRoot").innerHTML = (builders[type] || (() => ""))();
  safeCreateIcons();

/* ---------- Conexão do WhatsApp por QR Code ----------
   Um arquivo HTML sozinho NÃO mantém uma sessão de WhatsApp aberta: o QR Code
   precisa ser gerado por um pequeno "servidor companheiro" (Node) que segura a
   sessão e repassa as mensagens. Todo o lado do CRM já está pronto aqui e fala
   com esse servidor por REST simples — via a nossa própria API, que já fala
   com a Evolution API por trás (ver /api/whatsapp/* no backend):
     GET  /api/whatsapp/status   -> { status, me, qr }  (qr = data:image/...;base64,...)
     POST /api/whatsapp/connect -> inicia a conexão e gera o QR
     POST /api/whatsapp/logout  -> desconecta
   Sem a Evolution API configurada no backend (.env), o botão "Ver
   demonstração" mostra o fluxo visual do QR, claramente marcado como tal. */
function waStopPoll() { if (ui.waConn.poll) { clearInterval(ui.waConn.poll); clearTimeout(ui.waConn.poll); ui.waConn.poll = null; } }
function waRefreshModal() {
  if (ui.modal !== "wa-connect") return;
  const root = $("#modalRoot"); if (!root) return;
  root.innerHTML = modalWaConnect();
  const bg = $("#modalBg"); if (bg) bg.addEventListener("click", (e) => { if (e.target.id === "modalBg") { waStopPoll(); closeModal(); } });
}
async function waPollOnce() {
  try {
    const res = await api.whatsapp.status();
    const d = res.data;
    ui.waConn.status = d.status || "desconectado";
    ui.waConn.qr = d.qr || null;
    ui.waConn.me = d.me || null;
    ui.waConn.error = d.error || null;
    ui.waConn.demo = false;
    if (ui.waConn.status === "conectado") waStopPoll();
  } catch (e) {
    ui.waConn.status = "erro";
    ui.waConn.error = e.message || "Não foi possível falar com o servidor.";
    waStopPoll();
  }
  waRefreshModal();
}
async function waConnect() {
  if (PREVIEW_SEM_LOGIN) { waStartDemo(); return; }
  waStopPoll();
  ui.waConn.status = "conectando"; ui.waConn.error = null; ui.waConn.qr = null; ui.waConn.demo = false;
  waRefreshModal();
  try {
    const res = await api.whatsapp.connect();
    ui.waConn.status = res.data.status || "aguardando_qr";
    ui.waConn.qr = res.data.qr || null;
  } catch (e) {
    ui.waConn.status = "erro";
    ui.waConn.error = e.message || "Não foi possível iniciar a conexão.";
  }
  waRefreshModal();
  ui.waConn.poll = setInterval(waPollOnce, 2500);
}
async function waDisconnect() {
  waStopPoll();
  ui.waConn = { status: "desconectado", qr: null, me: null, error: null, poll: null, demo: false };
  try { await api.whatsapp.logout(); } catch (e) {}
  toast("WhatsApp desconectado.");
  render();
}
function waStartDemo() {
  waStopPoll();
  ui.waConn.status = "aguardando_qr"; ui.waConn.error = null; ui.waConn.me = null; ui.waConn.demo = true;
  ui.waConn.qr = waDemoQr();
  waRefreshModal();
  ui.waConn.poll = setTimeout(() => { ui.waConn.status = "conectado"; ui.waConn.me = "55 11 9•••• (demonstração)"; ui.waConn.qr = null; waRefreshModal(); render(); }, 4200);
}
function waDemoQr() {
  const n = 25, c = 8; let cells = "";
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const corner = (x < 7 && y < 7) || (x >= n - 7 && y < 7) || (x < 7 && y >= n - 7);
    let on;
    if (corner) { const lx = x % (n - 7), ly = y % (n - 7); on = (lx === 0 || ly === 0 || lx === 6 || ly === 6 || (lx > 1 && lx < 5 && ly > 1 && ly < 5)); }
    else on = ((x * 13 + y * 7 + (x * y) % 5) % 2 === 0);
    if (on) cells += '<rect x="' + (x * c) + '" y="' + (y * c) + '" width="' + c + '" height="' + c + '"/>';
  }
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + (n * c) + '" height="' + (n * c) + '" viewBox="0 0 ' + (n * c) + ' ' + (n * c) + '"><rect width="100%" height="100%" fill="#fff"/><g fill="#111827">' + cells + '</g></svg>';
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

// edit: compromisso do CRM (tem .titulo) ou evento só do Google (tem .start); vazio = novo
function modalCompromisso(edit) {
  const now = new Date(); const pad = (n) => String(n).padStart(2, "0");
  const todayVal = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  const ehGoogle = !!(edit && edit.start);
  let cur = edit || null;
  if (ehGoogle) {
    const ini = new Date(edit.start.dateTime), fim = new Date(edit.end && edit.end.dateTime);
    cur = { titulo: edit.summary || "", tipo: "", leadId: "", data: gcalDataItem(edit), hora: pad(ini.getHours()) + ":" + pad(ini.getMinutes()), duracao: isNaN(fim) ? 30 : Math.max(5, Math.round((fim - ini) / 60000)), local: edit.location || "" };
  }
  const v = (k, padrao) => esc(cur && cur[k] != null ? cur[k] : padrao);
  const oculto = ehGoogle ? 'style="display:none"' : ""; // evento do Google não tem tipo nem lead
  const body = `<div class="field-l"><label>Título *</label><input id="f_titulo" value="${v("titulo", "")}" placeholder="Ex: Reunião de proposta" /></div>
    <div class="modal-f two">
      <div class="field-l" ${oculto}><label>Tipo</label><select id="f_tipo">${["Reunião", "Ligação", "Follow-up", "Tarefa"].map(t => `<option ${cur && cur.tipo === t ? "selected" : ""}>${t}</option>`).join("")}</select></div>
      <div class="field-l" ${oculto}><label>Vincular a um Lead</label><select id="f_lead"><option value="">Nenhum</option>${state.leads.map(l => `<option value="${l.id}" ${cur && cur.leadId === l.id ? "selected" : ""}>${esc(l.nome)}</option>`).join("")}</select></div>
      <div class="field-l"><label>Data</label><input id="f_data" type="date" value="${v("data", todayVal)}" /></div>
      <div class="field-l"><label>Hora</label><input id="f_hora" type="time" value="${v("hora", "10:00")}" /></div>
      <div class="field-l"><label>Duração (min)</label><input id="f_dur" type="number" value="${v("duracao", 30)}" /></div>
      <div class="field-l"><label>Local</label><input id="f_local" value="${v("local", "")}" placeholder="Ex: Escritório, Google Meet..." /></div>
    </div>
    <div id="gcalBox" style="margin-top:4px">${gcalBoxHtml()}</div>`;
  const foot = `<button class="btn btn-g" id="btnIcs">${icon("download", 14)}.ics</button><button class="btn btn-g" id="btnGcal">${icon("external-link", 14)}Google Agenda</button><button class="btn btn-p" id="btnSalvarEvento">${icon("check", 15)}Salvar</button>`;
  const buildEv = () => {
    const start = new Date(`${$("#f_data").value}T${$("#f_hora").value}:00`);
    const end = new Date(start.getTime() + Number($("#f_dur").value) * 60000);
    const lead = state.leads.find(l => l.id === $("#f_lead").value);
    return { title: $("#f_titulo").value || $("#f_tipo").value, start, end, details: lead ? "Lead: " + lead.nome : "", location: $("#f_local").value };
  };
  setTimeout(() => {
    $("#btnIcs").addEventListener("click", () => downloadIcs(buildEv()));
    $("#btnGcal").addEventListener("click", () => openExternal(googleCalendarUrl(buildEv())));
    ["f_data", "f_hora", "f_dur"].forEach(id => $("#" + id).addEventListener("input", gcalChecarConflito));
    $("#f_lead").addEventListener("change", gcalBoxAtualizar); // o convite depende do e-mail do lead
    gcalChecarConflito();
    $("#btnSalvarEvento").addEventListener("click", async () => {
      const t = $("#f_titulo").value.trim(); if (!t) { toast("Digite um título."); return; }
      const ev = { id: "e_" + Date.now() + Math.random(), titulo: t, tipo: $("#f_tipo").value, data: $("#f_data").value, hora: $("#f_hora").value, duracao: Number($("#f_dur").value) || 30, leadId: $("#f_lead").value || null, local: $("#f_local").value };
      if (!ev.data || !ev.hora) { toast("Informe data e hora."); return; }
      if (edit) {
        const novo = ehGoogle ? { ...ev, id: edit.id } : { ...edit, titulo: ev.titulo, tipo: ev.tipo, data: ev.data, hora: ev.hora, duracao: ev.duracao, leadId: ev.leadId, local: ev.local };
        const gid = ehGoogle ? edit.id : edit.gcalId;
        const btn = $("#btnSalvarEvento"); btn.disabled = true;
        try {
          if (gid && gcalConectado()) await gcalEditar(gid, novo);
          else if (gid) toast("Google Agenda desconectado: a mudança vale só no CRM.");
          else if (gcalConectado() && $("#gSalvar") && $("#gSalvar").checked) {
            const r = await gcalCriar(novo, { meet: $("#gMeet").checked, convidar: $("#gConvidar").checked });
            novo.gcalId = r.id; novo.gcalLink = gcalLinkSeguro(r.htmlLink); novo.meet = gcalLinkSeguro(r.hangoutLink);
          }
        } catch (e) { btn.disabled = false; toast("Google Agenda: " + e.message + ". Nada foi alterado."); return; }
        if (!ehGoogle) {
          state.eventos = state.eventos.map(x => x.id === edit.id ? novo : x); saveSlice("eventos");
          addLogEntry(`Compromisso "${novo.titulo}" editado`, novo.leadId);
        }
        closeModal(); toast("Compromisso atualizado."); render(); gcalAtualizar();
        return;
      }
      if (gcalConectado() && $("#gSalvar") && $("#gSalvar").checked) {
        const btn = $("#btnSalvarEvento"); btn.disabled = true;
        try {
          const r = await gcalCriar(ev, { meet: $("#gMeet").checked, convidar: $("#gConvidar").checked });
          ev.gcalId = r.id; ev.gcalLink = gcalLinkSeguro(r.htmlLink); ev.meet = gcalLinkSeguro(r.hangoutLink);
        } catch (e) { btn.disabled = false; toast("Google Agenda: " + e.message + ". O compromisso não foi salvo."); return; }
      }
      addEvent(ev);
      closeModal();
      if (ev.gcalId) gcalAtualizar();
    });
  }, 0);
  return modalWrap("compromisso", edit ? "Editar Compromisso" : "Novo Compromisso", "calendar-days", body, foot);
}

function refreshStageList() {
  const el = $("#stageListBody");
  if (el) { el.innerHTML = renderStageListHtml(); safeCreateIcons(); bindStageListEvents(); }

function bindStageListEvents() {
  $$("[data-action='stage-up']").forEach(b => b.onclick = () => { moveStageOrder(b.dataset.id, -1); refreshStageList(); });
  $$("[data-action='stage-down']").forEach(b => b.onclick = () => { moveStageOrder(b.dataset.id, 1); refreshStageList(); });
  $$("[data-action='stage-edit']").forEach(b => b.onclick = () => { etapaEditando = b.dataset.id; refreshStageList(); const inp = $("#editStageName"); if (inp) inp.focus(); });
  $$("[data-action='stage-cancel-edit']").forEach(b => b.onclick = () => { etapaEditando = null; refreshStageList(); });
  $$("[data-action='stage-remove']").forEach(b => b.onclick = () => removeStage(b.dataset.id));
  $$("[data-action='stage-save-edit']").forEach(b => b.onclick = () => {
    const novoNome = $("#editStageName").value.trim();
    if (!novoNome) { toast("Digite um nome."); return; }

    etapaEditando = null; ui.stageColorPick = null;

    ui.stageColorPick = b.dataset.color;

          minhasNotas.map(n => `<div class="tl-item"><div class="tl-ic" style="background:var(--brand-weak);color:var(--brand)">${icon(notaIcon(n.tipo), 15)}</div>

              <div style="flex:1;min-width:0"><div style="font-size:13.5px;font-weight:700;overflow-wrap:anywhere">${esc(n.titulo)}</div>
                <div style="font-size:11.5px;color:var(--text-3);margin-top:2px">${esc(n.tipo)} · <span class="mono">${esc(new Date(n.dataEvento).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }))}</span></div></div>
              <button class="icon-btn" title="Editar anotação" data-action="nota-edit" data-nota-id="${esc(n.id)}" style="${btnIc}">${icon("edit-2", 15)}</button>
              <button class="icon-btn" title="Excluir anotação" data-action="nota-delete" data-nota-id="${esc(n.id)}" style="${btnIc};color:var(--bad)">${icon("trash-2", 15)}</button></div>

  } else if (tab === "tarefas") {
    body = `<div style="padding:22px;display:grid;gap:10px">${minhasTarefas.length === 0 ? `<div style="font-size:12.5px;color:var(--text-3);text-align:center;padding:18px 0">Nenhuma tarefa vinculada a este lead ainda.</div>` :
      minhasTarefas.map(t => `<div style="display:flex;align-items:center;gap:11px;padding:13px;background:var(--surface-2);border-radius:11px">
        <span class="cbox ${t.done ? "on" : ""}" data-action="toggle-task" data-task-id="${esc(t.id)}">${t.done ? icon("check", 12) : ""}</span>
        <span style="flex:1;font-size:13.5px;text-decoration:${t.done ? "line-through" : "none"};color:${t.done ? "var(--text-3)" : "var(--text)"}">${esc(t.t)}</span>
        <span class="chip" style="background:${PRI[t.pri].b};color:${PRI[t.pri].c}">${PRI[t.pri].l}</span>

      <button class="btn btn-g" style="justify-content:center" data-action="open-modal" data-modal="tarefa" data-lead-id="${esc(lead.id)}">${icon("plus", 15)}Nova tarefa</button></div>`;
  }

  root.innerHTML = `<div class="drawer-bg" data-action="close-drawer"></div><div class="drawer">
    <div class="drawer-h"><div class="ava" style="width:52px;height:52px;background:${avatarColor(lead.nome)};display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--font-d);font-size:16px;border-radius:50%">${initials(lead.nome)}</div>

            ${state.stages.map(st => `<option value="${st.id}" ${lead.stage === st.id ? "selected" : ""}>${esc(st.nome)}</option>`).join("")}</select>
          <span class="badge" style="background:${PRI[lead.pri].b};color:${PRI[lead.pri].c}">Prioridade ${PRI[lead.pri].l}</span></div></div>
      <button class="icon-btn" data-action="close-drawer">${icon("x", 18)}</button></div>

      <button class="btn btn-g" style="flex:1;justify-content:center" data-action="download-proposal" data-lead-id="${esc(lead.id)}">${icon("file-text", 15)}Proposta</button>

      <a class="btn btn-g" href="${esc(mailtoLink(lead.email, "Contato — " + lead.nome))}">${icon("mail", 15)}</a></div>
    <div style="display:flex;gap:8px;padding:0 22px 16px">
      <button class="btn btn-g" style="flex:1;justify-content:center" data-action="open-modal" data-modal="lead-edit" data-lead-id="${esc(lead.id)}">${icon("edit-2", 15)}Editar</button>
      <button class="btn btn-g" style="flex:1;justify-content:center;color:var(--bad)" data-action="delete-lead" data-lead-id="${esc(lead.id)}">${icon("trash-2", 15)}Excluir</button></div>

function renderModal() { /* modais não são reconstruídos no render() global — ver openModal()/closeModal() */ }

/* ---------- Preserva foco/cursor ao re-renderizar durante digitação (busca) ---------- */
function rerenderPreservingFocus() {
  const active = document.activeElement;
  const id = active && active.id;
  const selStart = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === "number" ? active.selectionEnd : null;
  render();
  if (id) {
    const el = document.getElementById(id);
    if (el) { el.focus(); if (selStart != null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selEnd); } catch (e) {} } }
  }
}

/* ============================== EVENTOS GLOBAIS (delegados, ligados uma única vez) ============================== */
function setupGlobalEvents() {
  document.addEventListener("click", async (e) => {
   try {
    // fecha dropdown de busca ao clicar fora
    if (!e.target.closest("#globalSearch") && !e.target.closest("#searchResults")) $("#searchResults").style.display = "none";

    const el = e.target.closest("[data-action]");
    if (!el) {
      // linha da tabela de leads / card de cliente / cartão do kanban -> abrir drawer
      const tr = e.target.closest("tr[data-lead-id]");
      if (tr && !e.target.closest("[data-nolead]")) { ui.drawerLeadId = tr.dataset.leadId; ui.drawerTab = "dados"; render(); return; }
      const card = e.target.closest(".card[data-lead-id]");
      if (card) { ui.drawerLeadId = card.dataset.leadId; ui.drawerTab = "dados"; render(); return; }
      const lcard = e.target.closest(".lcard[data-lead-id]");
      if (lcard) { ui.drawerLeadId = lcard.dataset.leadId; ui.drawerTab = "dados"; render(); return; }
      const conv = e.target.closest(".conv[data-conv-id]");
      if (conv) { ui.atendimentoSel = conv.dataset.convId; ui.atendimentoMobileList = false; render(); loadConversationMessages(conv.dataset.convId); return; }
      return;
    }
    const action = el.dataset.action;
    switch (action) {
      case "login-submit": doLogin(); break;
      case "login-forgot": {
        e.preventDefault();
        customPrompt("Recuperar senha", "Informe o e-mail da sua conta — se ele existir, enviaremos um link de redefinição.", "seu@email.com", async (email) => {
          if (!email) return;
          try { const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split("#")[0] }); if (error) throw error; toast("Se este e-mail existir, enviamos um link de recuperação."); }
          catch (err) { toast(err.message || "Não foi possível enviar o link agora."); }
        });
        break;
      }
      case "logout": doLogout(); break;
      case "open-modal": openModal(el.dataset.modal, el.dataset.leadId ? state.leads.find(l => l.id === el.dataset.leadId) : null); break;
      case "wa-open": openModal("wa-connect"); break;
      case "wa-connect": {
        if (ui.modal !== "wa-connect") openModal("wa-connect");
        waConnect(); break;
      }
      case "wa-demo": waStartDemo(); break;
      case "wa-cancel": { waStopPoll(); ui.waConn.status = ui.waConn.me ? "conectado" : "desconectado"; ui.waConn.qr = null; waRefreshModal(); break; }
      case "wa-disconnect": waDisconnect(); break;

      case "form-criar-modelo": {
        if (!sb || !sbSession) { toast("Entre com a sua conta para criar o formulário."); break; }
        const cfg = defaultFormConfig();
        const { error } = await sb.from("formularios").upsert({ slug: FORM_KEY, config: cfg });
        if (error) { showErrorBanner("O formulário não foi criado: " + error.message); break; }
        state.formConfig = cfg; toast("Formulário criado. Edite as perguntas e envie o link."); render();
        break;
      }
      case "form-new-question": openModal("form-question-new"); break;
      case "form-edit-question": {
        const q = (state.formConfig?.perguntas || []).find(x => x.id === el.dataset.id);
        if (q) openModal("form-question-edit", q);
        break;
      }
      case "form-delete-question": {
        const q = (state.formConfig?.perguntas || []).find(x => x.id === el.dataset.id);
        if (!q) break;
        customConfirm(`Excluir a pergunta "${q.pergunta}"? As respostas que já chegaram continuam guardadas nas anotações dos leads.`, true,
          () => mutarFormConfig(c => { c.perguntas = c.perguntas.filter(x => x.id !== q.id); }, "Pergunta excluída."));
        break;
      }
      case "form-move-question": {
        const id = el.dataset.id, dir = el.dataset.dir;
        mutarFormConfig(c => {
          const i = c.perguntas.findIndex(x => x.id === id), j = dir === "up" ? i - 1 : i + 1;
          if (i < 0 || j < 0 || j >= c.perguntas.length) return;
          [c.perguntas[i], c.perguntas[j]] = [c.perguntas[j], c.perguntas[i]];
        });
        break;
      }
      case "form-save-config": {
        const num = (id) => { const v = $("#" + id).value.trim(); return v === "" ? 0 : Number(v); };
        const alta = num("fcAlta"), media = num("fcMedia"), valor = num("fcValor"), pixel = $("#fcPixel").value.trim();
        if (![alta, media, valor].every(n => Number.isInteger(n) && n >= 0)) { toast("Pontos e valor precisam ser números inteiros, sem negativos."); break; }
        if (media > alta) { toast("Os pontos da prioridade média não podem passar dos da alta."); break; }
        if (pixel && !/^\d{5,20}$/.test(pixel)) { toast("O ID do Pixel deve ter só números."); break; }
        mutarFormConfig(c => {
          Object.assign(c, {
            titulo: $("#fcTitulo").value.trim(), botao: $("#fcBotao").value.trim() || "Começar", subtitulo: $("#fcSubtitulo").value.trim(),
            finalTitulo: $("#fcFinalTitulo").value.trim(), finalTexto: $("#fcFinalTexto").value.trim(), origem: $("#fcOrigem").value.trim() || "Formulário",
            classificacao: { alta, media }, valorPlano: valor, pixelId: pixel,
            etapas: { alta: $("#fcEtapaAlta").value, media: $("#fcEtapaMedia").value, baixa: $("#fcEtapaBaixa").value },
          });
        }, "Configurações salvas.");
        break;
      }
      case "form-preview-size": { const fr = $("#fpFrame"); if (fr) fr.style.width = el.dataset.size === "desktop" ? "100%" : "390px"; break; }
      case "form-card-img-remove": { ui.fs.imagem = ""; atualizarPreviewCartao(); break; }
      case "form-save-card": {
        const titulo = $("#fsTitulo").value.trim().slice(0, 90), descricao = $("#fsDescricao").value.trim().slice(0, 200);
        const dominio = $("#fsDominio").value.trim().toLowerCase().replace(/^https?:\/\//, "").replace(/\/.*$/, "");
        if (dominio && !/^([a-z0-9-]+\.)+[a-z]{2,}$/.test(dominio)) { toast("Domínio inválido. Use algo como mentoria.publicacademy.com.br"); break; }
        mutarFormConfig(c => { c.compartilhar = { titulo, descricao, imagem: ui.fs.imagem, dominio }; }, "Cartão salvo.");
        break;
      }
      case "form-visual-preset": {
        const claro = el.dataset.preset === "claro";
        $("#fvFundo").value = claro ? "#ffffff" : "#08080d"; $("#fvTexto").value = claro ? "#1b1b24" : "#f4f4f7";
        atualizarPreviewForm();
        break;
      }
      case "form-img-remove": { ui.fv[el.dataset.which] = ""; atualizarPreviewForm(); break; }
      case "form-save-visual": {
        const v = formVisualAtual();
        if (![v.corMarca, v.corFundo, v.corTexto].every(c => /^#[0-9a-fA-F]{6}$/.test(c))) { toast("Alguma cor está inválida."); break; }
        if (v.fundo === "imagem" && !imgSegura(v.fundoImagem)) { toast("Envie uma imagem de fundo ou escolha outro tipo de fundo."); break; }
        mutarFormConfig(c => { c.visual = v; }, "Aparência salva.");
        break;
      }
      case "form-reset-visual":
        customConfirm("Voltar cores, fundo, logo e etiqueta ao padrão?", false, () => mutarFormConfig(c => { c.visual = { ...FORM_VISUAL_PADRAO }; }, "Aparência restaurada."));
        break;
      case "form-copy-link": {
        const url = publicFormUrl();
        try { await navigator.clipboard.writeText(url); toast("Link copiado."); }
        catch (err) { toast("Não foi possível copiar automaticamente. Link: " + url); }
        break;
      }
      case "form-open-lead": e.preventDefault(); ui.drawerLeadId = el.dataset.leadId; ui.drawerTab = "dados"; render(); break;
      case "form-export-respostas": {
        const perguntas = state.formConfig?.perguntas || [];
        const resp = state.formRespostas || [];
        if (!resp.length) { toast("Ainda não há respostas para exportar."); break; }
        const seguro = (v) => /^[=+\-@\t\r]/.test(v) ? "'" + v : v; // evita o Excel ler como fórmula
        csvExport(`respostas-formulario-${new Date().toISOString().slice(0, 10)}.csv`, resp.map(r => {
          const lead = state.leads.find(l => l.id === r.lead_id);
          const linha = { "Data": new Date(r.created_at).toLocaleString("pt-BR"), "Lead": seguro(lead ? lead.nome : "(excluído)"), "Pontos": r.pontos, "Prioridade": r.prioridade || "", "Novo envio de lead existente": r.reenvio ? "Sim" : "Não" };
          perguntas.forEach(q => { linha[q.pergunta] = seguro(formRespostaTexto(q, r.respostas ? r.respostas[q.id] : "")); });
          return linha;
        }));
        toast("Respostas exportadas.");
        break;
      }
      case "close-modal": closeModal(); break;
      case "close-drawer": ui.drawerLeadId = null; render(); break;
      case "drawer-tab": ui.drawerTab = el.dataset.tab; render(); break;
      case "toggle-task": toggleTask(el.dataset.taskId); break;
      case "edit-task": { const t = state.tasks.find(x => x.id === el.dataset.taskId); if (t) openModal("tarefa-edit", t); break; }
      case "log-edit": {
        const e = state.log.find(x => String(x.id) === el.dataset.logId); if (!e) break;
        customPrompt("Editar registro do histórico", "", "Texto do registro", (txt) => {
          state.log = state.log.map(x => x.id === e.id ? { ...x, texto: txt } : x);
          saveSlice("log"); toast("Registro atualizado."); render();
        }, e.texto);
        break;
      }
      case "log-delete": {
        const e = state.log.find(x => String(x.id) === el.dataset.logId); if (!e) break;
        customConfirm(`Excluir o registro "${e.texto}" do histórico? Esta ação não pode ser desfeita.`, true, () => {
          state.log = state.log.filter(x => x.id !== e.id);
          saveSlice("log"); toast("Registro excluído."); render();
        });
        break;
      }
      case "nota-edit": { const n = state.notas.find(x => x.id === el.dataset.notaId); if (n) openModal("nota-edit", n); break; }
      case "nota-delete": {
        const n = state.notas.find(x => x.id === el.dataset.notaId); if (!n) break;
        customConfirm(`Excluir a anotação "${n.titulo}"? Esta ação não pode ser desfeita.`, true, () => excluirNota(n.id));
        break;
      }
      case "nota-export": { const l = state.leads.find(x => x.id === el.dataset.leadId); if (l) exportarNotas(l); break; }
      case "delete-task": {
        const t = state.tasks.find(x => x.id === el.dataset.taskId); if (!t) break;
        customConfirm(`Excluir a tarefa "${t.t}"?`, true, () => {
          state.tasks = state.tasks.filter(x => x.id !== t.id);
          saveSlice("tasks"); addLogEntry(`Tarefa "${t.t}" excluída`, t.leadId); toast("Tarefa excluída."); render();
        });
        break;
      }
      case "delete-lead": {
        const l = state.leads.find(x => x.id === el.dataset.leadId); if (!l) break;
        const qtdNotas = state.notas.filter(n => n.leadId === l.id).length;
        customConfirm(`Excluir "${l.nome}" definitivamente? As tarefas vinculadas continuam, mas sem o vínculo.${qtdNotas ? ` As ${qtdNotas} anotação(ões) do lead serão apagadas junto.` : ""} Esta ação não pode ser desfeita.`, true, () => {
          state.leads = state.leads.filter(x => x.id !== l.id);
          state.notas = state.notas.filter(n => n.leadId !== l.id); // no banco some em cascata
          if (state.tasks.some(t => t.leadId === l.id)) { state.tasks = state.tasks.map(t => t.leadId === l.id ? { ...t, leadId: null } : t); saveSlice("tasks"); }
          saveSlice("leads"); addLogEntry(`Lead "${l.nome}" excluído`);
          ui.drawerLeadId = null; toast("Lead excluído."); render();
        });
        break;
      }
      case "download-proposal": { const l = state.leads.find(x => x.id === el.dataset.leadId); if (l) downloadProposal(l); break; }
      case "reset-data": resetAllData(); break;
      case "add-membro": { const inp = $("#novoMembroInput"); const n = inp.value.trim(); if (n) { addMembro(n); } break; }
      case "remove-membro": removeMembro(el.dataset.nome); break;
      case "convert-conv": convertConversation(el.dataset.convId); break;
      case "clear-aguardando": limparAguardandoHumano(el.dataset.convId); toast("Marcado como atendido."); break;
      case "atendimento-back": ui.atendimentoMobileList = true; render(); break;
      case "quick-reply": sendChatMessage(ui.atendimentoSel, el.dataset.txt); break;
      case "chat-attach": $("#chatFileInput").click(); break;
      case "simulate-incoming": {
        const conv = state.convs.find(c => c.id === ui.atendimentoSel);
        customPrompt("Simular mensagem do cliente", `Isso registra a mensagem como se tivesse chegado de ${conv ? conv.nome : "o cliente"} pelo WhatsApp, e dispara a automação (se houver regra configurada).`, "Ex: Quanto custa a mentoria?", (txt) => simulateIncomingMessage(ui.atendimentoSel, txt));
        break;
      }
      case "add-auto-rule": {
        const nome = $("#autoNome").value.trim();
        const gatilho = $("#autoGatilho").value;
        const palavra = $("#autoPalavra").value.trim();
        const resposta = $("#autoResposta").value.trim();
        const moverParaEtapa = $("#autoEtapa").value;
        const notificarHumano = !!ui.autoNotificarChecked;
        if (!nome || !resposta || (gatilho === "palavra_chave" && !palavra)) { toast("Preencha nome, resposta e (se for por palavra-chave) a palavra."); break; }
        addAutomationRule({ nome, gatilho, palavra, resposta, moverParaEtapa, notificarHumano });
        $("#autoNome").value = ""; $("#autoPalavra").value = ""; $("#autoResposta").value = ""; $("#autoEtapa").value = "";
        ui.autoNotificarChecked = false;
        break;
      }
      case "toggle-auto-rule": toggleAutomationRule(el.dataset.id); break;
      case "remove-auto-rule": removeAutomationRule(el.dataset.id); break;
      case "toggle-automacao-ativa": setAutomacaoAtiva(!state.automacaoAtiva); break;
      case "ask-notification-permission": requestNotificationPermission(); break;
      case "toggle-notificar-checkbox": ui.autoNotificarChecked = !ui.autoNotificarChecked; render(); break;
      case "template-menu-automacao": {
        const etapaContato = state.stages.find(s => s.id === "contato") || state.stages[1] || state.stages[0];
        const etapaQualif = state.stages.find(s => s.id === "qualif") || state.stages[2] || state.stages[0];
        addAutomationRule({ nome: "Menu principal", gatilho: "primeira_mensagem", palavra: "", resposta: "Olá! Obrigado por entrar em contato. 😊\n\nDigite:\n1 - Falar com um atendente\n2 - Saber um orçamento\n3 - Outras dúvidas", moverParaEtapa: "", notificarHumano: false });
        addAutomationRule({ nome: "Opção 1 — Falar com atendente", gatilho: "palavra_chave", palavra: "1", resposta: "Certo! Um atendente humano vai te responder por aqui em instantes.", moverParaEtapa: etapaContato.id, notificarHumano: true });
        addAutomationRule({ nome: "Opção 2 — Orçamento", gatilho: "palavra_chave", palavra: "2", resposta: "Perfeito! Pra te passar um orçamento, um consultor vai te chamar aqui com algumas perguntas rápidas.", moverParaEtapa: etapaQualif.id, notificarHumano: true });
        toast("Modelo de menu criado — 3 regras adicionadas.");
        break;
      }
      case "chat-mic-start": startRecording(ui.atendimentoSel); break;
      case "chat-mic-stop": stopRecording(); break;
      case "chat-mic-cancel": cancelRecording(); break;
      case "start-video-call": startVideoCall(ui.atendimentoSel); break;
      case "csv-import-trigger": $("#csvFileInput").click(); break;
      case "csv-export": doCsvExport(); break;
      case "event-edit": { const ev = state.eventos.find(x => x.id === el.dataset.eventId); if (ev) openModal("compromisso-edit", ev); break; }
      case "gevent-edit": { const i = ((ui.gcal && ui.gcal.lista) || []).find(x => x.id === el.dataset.gid); if (i) openModal("compromisso-edit", i); break; }
      case "gevent-delete": {
        const i = ((ui.gcal && ui.gcal.lista) || []).find(x => x.id === el.dataset.gid); if (!i) break;
        customConfirm(`Excluir "${i.summary || "(sem título)"}" do Google Agenda? Quem foi convidado recebe o aviso de cancelamento.`, true, async () => {
          try { await gcalApi(`/calendars/${gcalCal()}/events/${encodeURIComponent(i.id)}?sendUpdates=all`, { method: "DELETE" }); }
          catch (e) { if (!/not found|deleted|gone/i.test(e.message)) { toast("Não foi possível apagar no Google: " + e.message); return; } }
          if (ui.gcal && ui.gcal.lista) ui.gcal.lista = ui.gcal.lista.filter(x => x.id !== i.id);
          toast("Compromisso excluído."); render(); gcalAtualizar();
        });
        break;
      }
      case "event-ics": { const ev = state.eventos.find(x => x.id === el.dataset.eventId); if (ev) downloadIcs(eventoToIcs(ev)); break; }
      case "event-gcal": { const ev = state.eventos.find(x => x.id === el.dataset.eventId); if (ev) openExternal(gcalLinkSeguro(ev.gcalLink) || googleCalendarUrl(eventoToIcs(ev))); break; }
      case "event-delete": {
        const ev = state.eventos.find(x => x.id === el.dataset.eventId); if (!ev) break;
        customConfirm(`Excluir o compromisso "${ev.titulo}"?` + (ev.gcalId ? " Ele também será removido do Google Agenda." : ""), true, async () => {
          if (ev.gcalId) {
            if (gcalConectado()) {
              try { await gcalApi(`/calendars/${gcalCal()}/events/${encodeURIComponent(ev.gcalId)}?sendUpdates=all`, { method: "DELETE" }); }
              catch (e) { if (!/not found|deleted|gone/i.test(e.message)) { toast("Não foi possível apagar no Google: " + e.message); return; } }
            } else toast("Google Agenda desconectado: o evento continua lá, só saiu do CRM.");
          }
          state.eventos = state.eventos.filter(x => x.id !== ev.id); saveSlice("eventos");
          addLogEntry(`Compromisso "${ev.titulo}" excluído`, ev.leadId);
          toast("Compromisso excluído."); render(); gcalAtualizar();
        });
        break;
      }
      case "col-mais": { const id = el.dataset.stage; ui.colLimit = ui.colLimit || {}; ui.colLimit[id] = (ui.colLimit[id] || COL_PAGE) + COL_PAGE; render(); break; }
      case "leads-mais": ui.leadsLimit = (ui.leadsLimit || TAB_PAGE) + TAB_PAGE * 2; render(); break;
      case "alunos-mais": ui.alunosLimit = (ui.alunosLimit || ALUNO_PAGE) + ALUNO_PAGE; render(); break;
      case "gcal-config": openModal("gcal-config"); break;
      case "gcal-connect": gcalConectar(); break;
      case "gcal-modal-connect": gcalConectar(gcalBoxAtualizar); break;
      case "gcal-refresh": gcalAtualizar(); break;
      case "gcal-disconnect": {
        customConfirm("Desconectar o Google Agenda? Isso vale para toda a equipe: será preciso conectar de novo.", true, async () => {
          try { await gcalServidor("desconectar"); } catch (e) { toast("Não foi possível desconectar: " + e.message); return; }
          ui.gcal = null; toast("Google Agenda desconectado."); render();
        });
        break;
      }
      case "edit-meta": ui.editingMeta = true; render(); setTimeout(() => { const i = $("#metaInput"); if (i) i.focus(); }, 0); break;
      case "save-meta": { const v = $("#metaInput").value; ui.editingMeta = false; setMeta(v); break; }
      case "cancel-meta": ui.editingMeta = false; render(); break;
      case "toggle-integr-card": ui.openIntegrCard = ui.openIntegrCard === el.dataset.card ? null : el.dataset.card; render(); break;
      case "integr-mode": { ui.integrDraft = ui.integrDraft || {}; ui.integrDraft[el.dataset.id] = { ...(ui.integrDraft[el.dataset.id] || state.integr[el.dataset.id]), mode: el.dataset.mode }; render(); break; }
      case "integr-save": { const id = el.dataset.id; const draft = { ...state.integr[id], ...(ui.integrDraft && ui.integrDraft[id] || {}) }; saveIntegr(id, draft); ui.integrDraft = ui.integrDraft || {}; delete ui.integrDraft[id]; toast("Integração atualizada."); break; }
      case "toggle-guide": ui.openGuide = ui.openGuide === el.dataset.id ? null : el.dataset.id; render(); break;
      default: break;
    }
   } catch (err) {
     console.error("Erro ao processar clique:", err);
     showErrorBanner((err && (err.stack || err.message)) || String(err));
   }
  });

  document.addEventListener("input", (e) => {
    if (e.target.id === "globalSearch") { ui.searchQ = e.target.value; renderSearchResults(); return; }
    if (e.target.id === "leadsSearch") { ui.leadsQ = e.target.value; ui.leadsLimit = 0; rerenderPreservingFocus(); return; }
    if (e.target.id === "funilSearch") { ui.funilQ = e.target.value; rerenderPreservingFocus(); return; }
    if (e.target.id === "atendimentoSearch") { ui.atendimentoQ = e.target.value; rerenderPreservingFocus(); return; }
    const integrField = e.target.closest("[data-action='integr-field']");
    if (integrField) { ui.integrDraft = ui.integrDraft || {}; const id = integrField.dataset.id, key = integrField.dataset.key; ui.integrDraft[id] = { ...(ui.integrDraft[id] || state.integr[id]) }; ui.integrDraft[id][key] = integrField.value; }
  });

  document.addEventListener("change", (e) => {
    if (e.target.id === "leadsRegimeFilter") { ui.leadsFReg = e.target.value; render(); return; }
    if (e.target.id === "autoGatilho") { const wrap = $("#autoPalavraWrap"); if (wrap) wrap.style.display = e.target.value === "palavra_chave" ? "block" : "none"; return; }
    const stageSelect = e.target.closest("[data-action='move-stage-select']");
    if (stageSelect) { moveStage(stageSelect.dataset.leadId, stageSelect.value); return; }
    const atendenteSelect = e.target.closest("[data-action='assign-atendente']");
    if (atendenteSelect) {
      const v = atendenteSelect.value;
      state.convs = state.convs.map(c => c.id === atendenteSelect.dataset.convId ? { ...c, atendente: v || null } : c);
      saveSlice("convs");
      addLogEntry(v ? `Conversa atribuída a "${v}"` : "Conversa desatribuída");
      render();
      return;
    }
    if (e.target.id === "fsImagemFile") {
      const f = e.target.files[0]; e.target.value = "";
      if (f) carregarImagemCartao(f);
      return;
    }
    if (e.target.id === "fvImagemFile" || e.target.id === "fvLogoFile") {
      const f = e.target.files[0]; const logo = e.target.id === "fvLogoFile"; e.target.value = "";
      if (f) carregarImagemForm(f, logo);
      return;
    }
    if (e.target.id === "csvFileInput") { const f = e.target.files[0]; if (f) doCsvImport(f); e.target.value = ""; return; }
    if (e.target.id === "chatFileInput") { const files = e.target.files; if (files && files.length) handleChatFiles(ui.atendimentoSel, files); e.target.value = ""; return; }

  });

  // o iframe da pré-visualização avisa que carregou; respondemos com as perguntas (e a aparência ainda não salva)
  window.addEventListener("message", (e) => {
    const fr = $("#fpFrame");
    if (!fr || e.source !== fr.contentWindow || !e.data || e.data.tipo !== "preview-pronto" || !state.formConfig) return;
    const cfg = { ...state.formConfig };
    if ($("#fvMarca") && ui.fv) cfg.visual = formVisualAtual();
    fr.contentWindow.postMessage({ tipo: "preview-config", config: cfg }, "*");
  });

  // pré-visualização do formulário ao vivo (cartão Aparência)
  document.addEventListener("input", (e) => {
    if (!e.target.closest) return;
    if (e.target.closest("#fvCard")) atualizarPreviewForm();
    else if (e.target.closest("#fsCard")) atualizarPreviewCartao();
  });

  // seleção de linhas (checkbox) — usa mousedown pra não conflitar com o clique da linha
  document.addEventListener("mousedown", (e) => {
    const box = e.target.closest("[data-sel-id]");
    if (box) { e.stopPropagation(); ui.leadsSel = ui.leadsSel || new Set(); const id = box.dataset.selId; ui.leadsSel.has(id) ? ui.leadsSel.delete(id) : ui.leadsSel.add(id); render(); }
    const selAll = e.target.closest("#selAllBox");
    if (selAll) { e.stopPropagation(); const q = (ui.leadsQ || "").toLowerCase(); const rows = state.leads.filter(l => (l.nome + l.email + l.wa + l.nicho + l.resp).toLowerCase().includes(q)); ui.leadsSel = ui.leadsSel || new Set(); const allOn = rows.every(r => ui.leadsSel.has(r.id)); ui.leadsSel = allOn ? new Set() : new Set(rows.map(r => r.id)); render(); }
    const th = e.target.closest("th[data-sort]");
    if (th) { const k = th.dataset.sort; ui.leadsSort = ui.leadsSort || { k: "razao", dir: 1 }; ui.leadsSort = { k, dir: ui.leadsSort.k === k ? -ui.leadsSort.dir : 1 }; render(); }
  });

  // Kanban: arrastar e soltar
  document.addEventListener("dragstart", (e) => { const c = e.target.closest(".lcard"); if (c) { e.dataTransfer.setData("text/plain", c.dataset.leadId); c.classList.add("ghost"); } });
  document.addEventListener("dragend", (e) => { const c = e.target.closest(".lcard"); if (c) c.classList.remove("ghost"); });
  document.addEventListener("dragover", (e) => { const col = e.target.closest(".col[data-stage]"); if (col) { e.preventDefault(); col.classList.add("drag"); } });
  document.addEventListener("dragleave", (e) => { const col = e.target.closest(".col[data-stage]"); if (col) col.classList.remove("drag"); });
  document.addEventListener("drop", (e) => {
    const col = e.target.closest(".col[data-stage]");
    if (col) { e.preventDefault(); col.classList.remove("drag"); const id = e.dataTransfer.getData("text/plain"); if (id) moveStage(id, col.dataset.stage); }
  });

  // Chat: enviar mensagem
  document.addEventListener("keydown", (e) => {
    if (e.target.id === "chatInput" && e.key === "Enter") { sendChatMessage(ui.atendimentoSel, e.target.value); e.target.value = ""; }
    if ((e.target.id === "loginEmail" || e.target.id === "loginSenha") && e.key === "Enter") { e.preventDefault(); doLogin(); }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("#globalSearch")?.focus(); }
    if (e.key === "Escape") { const sq = $("#globalSearch"), sr = $("#searchResults"); ui.searchQ = ""; if (sq) sq.value = ""; if (sr) sr.style.display = "none"; }
  });
  document.addEventListener("click", (e) => {
    if (e.target.id === "chatSendBtn") { const inp = $("#chatInput"); sendChatMessage(ui.atendimentoSel, inp.value); inp.value = ""; }
  });

  $("#menuBtnMobile").addEventListener("click", () => { ui.mobileOpen = !ui.mobileOpen; render(); });
  $("#menuBtnDesktop").addEventListener("click", () => { ui.collapsed = !ui.collapsed; render(); });
  $("#mobileOverlay").addEventListener("click", () => { ui.mobileOpen = false; render(); });
  $("#themeToggle").addEventListener("click", () => { ui.theme = ui.theme === "light" ? "dark" : "light"; store.set("crm_vivershopee_theme", ui.theme); render(); });
  $("#atenderBtn").addEventListener("click", () => setView("atendimento"));
  $("#userChipBtn").addEventListener("click", () => {
    if (!state.currentUser) { setView("usuarios"); return; }
    customConfirm(`Sair da conta de ${state.currentUser.nome}?`, false, () => doLogout());
  });
  $$(".nav-i").forEach(btn => btn.addEventListener("click", () => setView(btn.dataset.view)));
}

function eventoToIcs(e) {
  const start = new Date(`${e.data}T${e.hora}:00`);
  const end = new Date(start.getTime() + e.duracao * 60000);
  const lead = state.leads.find(l => l.id === e.leadId);
  return { title: e.titulo, start, end, details: lead ? "Lead: " + lead.nome : "", location: e.local };
}

function doCsvExport() {
  const sel = ui.leadsSel || new Set();
  const base = sel.size > 0 ? state.leads.filter(l => sel.has(l.id)) : state.leads;
  const data = base.map(l => ({ nome: l.nome, email: l.email, whatsapp: l.wa, ja_vende: l.jaVende, nivel: l.nivel, nicho: l.nicho, objetivo: l.objetivo, capital_investimento: l.invest, faturamento_shopee: l.fatShopee, origem: l.origem, responsavel: l.resp, etapa: stageOf(l.stage).nome, valor: l.valor, probabilidade: l.prob }));
  csvExport("leads_" + new Date().toISOString().slice(0, 10) + ".csv", data);
}
function doCsvImport(file) {
  Papa.parse(file, {
    header: true, skipEmptyLines: true,
    complete: (res) => {
      const novos = res.data.filter(r => r.nome || r.email || r.whatsapp || r.telefone).map(r => mk({
        nome: r.nome || r.email || "Sem nome", email: r.email || "—", wa: r.whatsapp || r.wa || r.telefone || "—", tel: r.whatsapp || r.telefone || "",
        jaVende: r.ja_vende || r.jaVende || "Não", nivel: r.nivel || "Ainda não vende", nicho: r.nicho || "—",
        objetivo: r.objetivo || "—", invest: Number(r.capital_investimento || r.investimento) || 0, fatShopee: Number(r.faturamento_shopee) || 0,
        origem: r.origem || "Importação CSV", resp: r.responsavel || "Não atribuído", stage: "novo",
        valor: Number(r.valor || r.valor_potencial) || 0, prob: Number(r.probabilidade) || 20, pri: "media",
      }));
      if (novos.length) { state.leads = [...novos, ...state.leads]; saveSlice("leads"); toast(`${novos.length} lead(s) importado(s) com sucesso.`); render(); }
      else toast("Nenhuma linha válida encontrada no CSV.");
    },
    error: () => toast("Não foi possível ler o arquivo CSV."),
  });
}

function renderSearchResults() {
  const box = $("#searchResults");
  const q = (ui.searchQ || "").trim();
  if (!q) { box.style.display = "none"; return; }
  const results = state.leads.filter(l => (l.nome + l.email + l.wa + l.nicho).toLowerCase().includes(q.toLowerCase())).slice(0, 7);
  box.style.display = "block";
  box.innerHTML = results.length === 0 ? `<div style="padding:16px;font-size:13px;color:var(--text-3)">Nenhum resultado para "${esc(q)}"</div>` :
    results.map(l => `<div data-action="search-pick" data-lead-id="${esc(l.id)}" style="display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer">
      <div class="ava" style="width:28px;height:28px;background:${avatarColor(l.nome)};display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--font-d);font-size:10px;border-radius:50%">${initials(l.nome)}</div>
      <div style="min-width:0;flex:1"><div style="font-size:13px;font-weight:600">${esc(l.nome)}</div><div style="font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(l.email)}</div></div>
      <span class="badge" style="background:${stageOf(l.stage).cor}1f;color:${stageOf(l.stage).cor};flex-shrink:0">${esc(stageOf(l.stage).nome)}</span></div>`).join("");
  $$("[data-action='search-pick']", box).forEach(el => el.addEventListener("mousedown", () => {
    ui.drawerLeadId = el.dataset.leadId; ui.drawerTab = "dados"; ui.searchQ = ""; $("#globalSearch").value = ""; box.style.display = "none"; render();
  }));
  safeCreateIcons();
}

/* ============================== INICIALIZAÇÃO ============================== */
function finishBoot() {
  $("#loadingScreen").style.display = "none";
  render();
  if (ui.view === "dashboard" && tokens.access && !sb) {
    api.dashboard.get({ dias: 30 }).then(res => { state.dashboardData = res.data; render(); }).catch(() => {});
  }
}
/* Rede de segurança final: qualquer erro inesperado não deixa a tela de
   carregamento travada para sempre — libera o app (mesmo que com dados só
   locais) e MOSTRA o erro na própria tela (não só no console, que ninguém
   consegue abrir no celular), pra dar pra diagnosticar de verdade. */
function showErrorBanner(msg) {
  try {
    let banner = document.getElementById("crmErrorBanner");
    if (!banner) {
      banner = document.createElement("div");
      banner.id = "crmErrorBanner";
      banner.style.cssText = "position:fixed;bottom:0;left:0;right:0;z-index:999;background:#3a0d0d;color:#ffb4b4;padding:12px 16px;font:12px monospace;max-height:40vh;overflow:auto;white-space:pre-wrap;border-top:2px solid #E5484D";
      document.body.appendChild(banner);
    }
    banner.textContent = "Erro no CRM (toque pra fechar): " + msg;
    banner.onclick = () => banner.remove();
  } catch (e) {}
}
window.addEventListener("error", (e) => {
  const msg = (e.error && (e.error.stack || e.error.message)) || e.message || "erro desconhecido";
  console.error("Erro no CRM:", msg);
  showErrorBanner(String(msg).slice(0, 500));
  if (!window.__crmReady) { window.__crmReady = true; try { finishBoot(); } catch (e2) { $("#loadingScreen").style.display = "none"; } }
});
window.addEventListener("unhandledrejection", (e) => {
  showErrorBanner("Promessa rejeitada: " + (e.reason && e.reason.message || e.reason));
});

function boot() {
  $("#brandLogo").src = LOGO_DATA_URI;
  $("#loadingLogo").src = LOGO_DATA_URI;
  const savedTheme = store.get("crm_vivershopee_theme");
  if (savedTheme === "light" || savedTheme === "dark") ui.theme = savedTheme;
  setupGlobalEvents();
  loadFromCacheOnly(); // dados locais dos módulos ainda não religados (tarefas, agenda, equipe...)
  loadTokens();

  if (PREVIEW_SEM_LOGIN) {
    // Pula login e API: carrega dados fictícios de demonstração pra você
    // ver a interface hoje. Lembrete: desligue PREVIEW_SEM_LOGIN (lá no
    // topo do script) antes de publicar de verdade.
    const demo = buildDemoData();
    state.leads = demo.leads; state.convs = demo.convs; state.tasks = demo.tasks; state.eventos = demo.eventos;
    state.equipe = demo.equipe; state.meta = demo.meta; state.demoMode = true;
    state.currentUser = { id: 0, nome: "Pré-visualização", email: "", role: "admin", roleNome: "Modo de demonstração" };
    state.stagesBackend = state.stages.map((s, i) => ({ id: i + 1, nome: s.nome, cor: s.cor, posicao: i + 1 }));
    buildStageMapping(state.stagesBackend);
    window.__crmReady = true;
    $("#loadingScreen").style.display = "none";
    render();
    return;
  }

  syncState = "connecting";
  sb.auth.getSession().then(({ data }) => {
    sbSession = data.session;
    if (!sbSession) {
      // Sem sessão salva: mostra a tela de login direto, sem tentar carregar nada.
      syncState = "off";
      window.__crmReady = true;
      $("#loadingScreen").style.display = "none";
      render();
      return;
    }
    state.currentUser = sbUserFromSession(sbSession);
    return loadAllFromApi();
  }).catch(() => { syncState = "error"; });
  sb.auth.onAuthStateChange((event) => {
    if (event === "SIGNED_OUT" && sbSession) { sbSession = null; state.currentUser = null; render(); }
  });
  // Rede de segurança: se em 8s a API não responder nada, libera a tela
  // mesmo assim (mostra o login se não havia dados, ou o que tiver em cache).
  setTimeout(() => { if (!window.__crmReady) { window.__crmReady = true; finishBoot(); } }, 8000);
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();

</script>
